.corner-bracket.tr{top:10px;inset-inline-end:10px;border-top:1px solid var(--gold);border-inline-end:1px solid var(--gold);transform:translate(-6px,6px);}
[dir="rtl"] .corner-bracket.tr{transform:translate(6px,6px);}
.corner-bracket.bl{bottom:10px;inset-inline-start:10px;border-bottom:1px solid var(--gold);border-inline-start:1px solid var(--gold);transform:translate(6px,-6px);}
[dir="rtl"] .corner-bracket.bl{transform:translate(-6px,-6px);}
.corner-bracket.br{bottom:10px;inset-inline-end:10px;border-bottom:1px solid var(--gold);border-inline-end:1px solid var(--gold);transform:translate(-6px,-6px);}
[dir="rtl"] .corner-bracket.br{transform:translate(6px,-6px);}
.ornamented:hover .corner-bracket{opacity:1;transform:translate(0,0);}
.collection-card:hover .arch-frame .placeholder-img,
.product-card:hover .placeholder-img{transform:scale(1.07);}
.placeholder-img span{font-family:var(--sans);font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft);}
.star6{width:26px;height:26px;opacity:.65;}
.placeholder-img.real{background:var(--white);min-height:0;}
.real-img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .7s cubic-bezier(.16,1,.3,1);}
/* Chocolate category: boost color vividness/appetite-appeal on product photos (they read a bit flat/washed out at default levels) */
.product-card.cat-chocolate .real-img,
.qv-image.cat-chocolate .real-img{filter:saturate(1.45) contrast(1.1) brightness(1.04);}

/* ---------- premium image magnifier (opt-in via toggle icon, single shared lens) ---------- */
.pc-clickable, .qv-image{position:relative;}
.mag-toggle{
  position:absolute;bottom:8px;inset-inline-end:8px;z-index:3;
  width:30px;height:30px;border-radius:50%;
  background:rgba(255,253,249,.94);border:1px solid var(--cream-2);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-sm);transition:all .25s ease;
}
.mag-toggle svg{width:15px;height:15px;color:var(--ink-soft);transition:color .25s ease;}
.mag-toggle:hover{border-color:var(--gold-light);}
.mag-toggle.active{background:var(--red);border-color:var(--red);}
.mag-toggle.active svg{color:var(--cream);}
.pc-clickable.mag-on, .qv-image.mag-on{cursor:crosshair;}
.img-magnifier{
  position:fixed;width:150px;height:150px;border-radius:50%;
  border:1.5px solid rgba(201,162,74,.55);
  box-shadow:0 10px 28px rgba(43,23,21,.28), inset 0 0 0 1px rgba(255,255,255,.55);
  background-repeat:no-repeat;background-color:#fff;
  pointer-events:none;opacity:0;z-index:250;
  transition:opacity .16s ease;will-change:transform,background-position,background-size;
}
.img-magnifier.active{opacity:1;}
.img-magnifier::after{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 30% 26%, rgba(255,255,255,.38), rgba(255,255,255,0) 55%);
  pointer-events:none;
}
@media(max-width:640px){.img-magnifier{width:118px;height:118px;}}

/* ---------- header utility row (integrated, replaces black topbar) ---------- */
.header-utility{
  display:flex;align-items:center;justify-content:space-between;
  max-width:1400px;margin:0 auto;padding:7px 24px;
  border-bottom:1px solid var(--cream-2);
}
.header-utility .hu-social{display:flex;gap:14px;align-items:center;}
.header-utility .hu-social a{display:flex;align-items:center;justify-content:center;transition:transform .3s ease, opacity .3s ease;opacity:.92;}
.header-utility .hu-social a:hover{transform:translateY(-2px);opacity:1;}
.header-utility .hu-social svg{width:19px;height:19px;border-radius:5px;}
.header-utility .hu-lang{display:flex;align-items:center;gap:5px;font-size:.72rem;letter-spacing:.03em;}
.header-utility .hu-lang button{padding:2px 3px;color:var(--ink-soft);font-weight:400;transition:color .3s;}
.header-utility .hu-lang button.active{color:var(--red);font-weight:600;}
.header-utility .hu-lang .hu-sep{color:var(--cream-2);font-size:.7rem;}

/* ---------- header ---------- */
header.site{
  position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(251,246,236,.96);backdrop-filter:blur(12px);
  border-bottom:1px solid color-mix(in srgb, var(--gold) 40%, transparent);transition:box-shadow .4s ease;
}
header.site.is-scrolled{box-shadow:0 6px 28px -10px rgba(43,23,21,.18);}
header.site .header-utility{transition:max-height .4s ease, opacity .35s ease, padding .4s ease;max-height:40px;overflow:hidden;}
header.site.is-scrolled .header-utility{max-height:0;opacity:0;padding-top:0;padding-bottom:0;border-bottom-color:transparent;}
#headerSpacer{width:100%;}
.nav-wrap{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 24px;max-width:1400px;margin:0 auto;transition:padding .4s ease;}
header.site.is-scrolled .nav-wrap{padding-top:10px;padding-bottom:10px;}
.logo{display:flex;align-items:center;gap:10px;transition:transform .3s ease;flex-shrink:0;}
.logo:hover{transform:translateY(-1px);}
.logo .mark{width:46px;height:46px;color:var(--red);border-radius:50%;overflow:hidden;flex-shrink:0;
  box-shadow:0 0 0 1px rgba(201,162,74,.5);}
.brand-logo-img{width:100%;height:100%;object-fit:cover;display:block;}
.logo .word{display:flex;flex-direction:column;line-height:1.05;}
.logo .word b{font-family:var(--serif);font-size:1.35rem;color:var(--red);letter-spacing:.02em;}
.logo .word em{font-style:normal;font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-dim);}
nav.primary{display:none;gap:0;align-items:center;flex:1;justify-content:center;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;}
nav.primary::-webkit-scrollbar{display:none;}
@media(min-width:1180px){nav.primary{display:flex;}}
nav.primary a{position:relative;font-size:.78rem;letter-spacing:.045em;text-transform:uppercase;padding:8px 13px;color:var(--ink-soft);
  transition:color .3s ease;white-space:nowrap;font-weight:400;}
nav.primary a::after{content:'';position:absolute;inset-inline-start:13px;inset-inline-end:13px;bottom:2px;height:1px;
  background:var(--gold);transform:scaleX(0);transform-origin:center;transition:transform .4s cubic-bezier(.16,1,.3,1);}
nav.primary a:hover, nav.primary a.active{color:var(--red);}
nav.primary a:hover::after, nav.primary a.active::after{transform:scaleX(1);}
@media(min-width:1180px) and (max-width:1320px){nav.primary a{font-size:.72rem;padding:8px 9px;}}
.nav-actions{display:flex;align-items:center;gap:6px;}
.icon-btn{position:relative;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--ink);transition:all .3s;}
.icon-btn:hover{background:var(--cream-2);color:var(--red);}
.icon-btn svg{width:19px;height:19px;}
.badge{position:absolute;top:2px;inset-inline-end:2px;background:var(--red);color:#fff;font-size:.6rem;
  width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--sans);}
.menu-toggle{display:flex;}
@media(min-width:1180px){.menu-toggle{display:none;}}
.nav-actions{display:flex;align-items:center;gap:2px;flex-shrink:0;}
.nav-divider{width:1px;height:20px;background:var(--cream-2);margin:0 6px;flex-shrink:0;}
@media(max-width:520px){.nav-divider{display:none;}}

/* mobile drawer nav */
.mobile-nav{position:fixed;inset:0;background:rgba(43,23,21,.55);z-index:80;opacity:0;pointer-events:none;transition:opacity .3s;}
.mobile-nav.open{opacity:1;pointer-events:auto;}
.mobile-nav .panel{position:absolute;top:0;inset-inline-start:0;width:82%;max-width:340px;height:100%;background:var(--cream);
  padding:26px 22px;transform:translateX(-100%);transition:transform .4s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;gap:4px;}
[dir="rtl"] .mobile-nav .panel{transform:translateX(100%);}
.mobile-nav.open .panel{transform:translateX(0);}
.mobile-nav a{padding:14px 6px;border-bottom:1px solid var(--cream-2);font-family:var(--serif);font-size:1.15rem;color:var(--ink);}
.mobile-nav .close{align-self:flex-end;width:34px;height:34px;}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 30px;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;
  border-radius:10px;transition:all .35s cubic-bezier(.16,1,.3,1);cursor:pointer;white-space:nowrap;
}
.btn svg{width:16px;height:16px;flex-shrink:0;}
.btn-primary{background:color-mix(in srgb, var(--red) 65%, var(--red-deep) 35%);color:var(--cream);border:1.5px solid var(--white);}
.btn-primary:hover{background:var(--red-deep);box-shadow:0 10px 22px -10px rgba(114,0,24,.55), 0 0 0 1px rgba(201,162,74,.25);transform:translateY(-2px);}
.btn-gold{background:var(--gold);color:var(--ink);border:1px solid var(--gold);}
.btn-gold:hover{background:var(--gold-light);transform:translateY(-2px);}
.btn-outline{background:transparent;color:var(--ink);border:1px solid var(--ink);}
.btn-outline:hover{background:var(--ink);color:var(--cream);}
.btn-whatsapp{background:#25563B;color:#fff;border:1px solid #25563B;}
.btn-whatsapp:hover{background:#1c4530;transform:translateY(-2px);}
.btn-sm{padding:9px 18px;font-size:.72rem;}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none !important;}

/* ---------- hero ---------- */
.hero{position:relative;width:100%;aspect-ratio:16/9;max-height:380px;display:flex;align-items:center;justify-content:center;
  text-align:center;overflow:hidden;background:var(--red-deep);}
@media(max-width:640px){.hero{max-height:260px;}}
.hero-photo{position:absolute;inset:0;background-size:cover;background-position:center;opacity:1;}
.hero-pattern{position:absolute;bottom:0;left:0;right:0;height:64px;opacity:.28;color:var(--gold-light);}
.hero-inner{position:relative;z-index:2;max-width:540px;padding:0 24px;color:var(--cream);}
.hero .crest{width:38px;height:38px;margin:0 auto 14px;color:var(--gold-light);animation:fadeDown 1.1s ease both;
  border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px rgba(228,201,122,.7);opacity:.92;}
.hero-brand{font-size:clamp(1.9rem,4.4vw,2.9rem);color:var(--cream);margin:0;letter-spacing:.01em;line-height:1.1;
  text-shadow:0 2px 14px rgba(0,0,0,.35);animation:fadeDown 1.1s .15s ease both;}
.hero-brand-sub{font-family:var(--serif);font-size:clamp(1.05rem,2.2vw,1.4rem);color:var(--gold-light);margin-top:2px;
  text-shadow:0 2px 10px rgba(0,0,0,.3);animation:fadeDown 1.1s .25s ease both;}
.hero-tag{font-size:.95rem;color:rgba(251,246,236,.92);max-width:400px;margin:14px auto 24px;font-weight:300;
  text-shadow:0 1px 8px rgba(0,0,0,.3);animation:fadeDown 1.1s .38s ease both;}
.hero .cta-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;animation:fadeDown 1.1s .5s ease both;}
.hero .cta-row .btn{padding:10px 26px;font-size:.76rem;border-radius:9px;box-shadow:0 4px 14px -4px rgba(0,0,0,.3);}
@keyframes fadeDown{from{opacity:0;transform:translateY(-16px);}to{opacity:1;transform:translateY(0);}}
.scroll-cue{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);color:var(--gold-light);opacity:.8;
  display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;}
.scroll-cue svg{animation:bob 2s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(7px);}}

/* ---------- Hero intro sequence: the hero photo shows briefly, then
   fades away, and in that EXACT same spot the screen splits into two
   halves. Both halves advance TOGETHER on one shared timer — so related
   product images are always visible at the same moment — each image
   getting a slow, light Ken Burns zoom while it's shown. ---------- */
.hero-photo-stage{position:absolute;inset:0;z-index:2;opacity:1;transition:opacity 1.3s ease;}
.hero-photo-stage.hero-fade-out{opacity:0;pointer-events:none;}
.hero-split{position:absolute;inset:0;z-index:1;display:flex;opacity:0;transition:opacity 1.5s ease;}
.hero-split.hero-split-active{opacity:1;}
.hero-half{position:relative;width:50%;height:100%;overflow:hidden;}
.hero-half-left{border-inline-end:1px solid rgba(255,248,239,.25);}
.hero-slide{
  position:absolute;inset:0;background-size:cover;background-position:center;
  opacity:0;transform:scale(1);transition:opacity 1.4s ease;
}
.hero-slide.active{opacity:1;animation:heroKenBurns 4.8s ease-out forwards;}
@keyframes heroKenBurns{from{transform:scale(1.0);}to{transform:scale(1.06);}}

/* ---------- trust strip ---------- */
/* ---------- features / trust band (its own distinct red-pink band, not
   see-through to the page background — reads as a real section) ---------- */
.trust-band{
  background:linear-gradient(135deg, color-mix(in srgb, var(--red) 82%, var(--red-deep) 18%) 0%, var(--red-soft-bg-2) 100%);
  padding:30px 0 28px;
  border-bottom:1px solid color-mix(in srgb, var(--gold) 30%, transparent);
}
.trust-strip{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 20px;max-width:1100px;margin:0 auto;
  padding:0 24px;}
@media(min-width:760px){.trust-strip{grid-template-columns:repeat(4,1fr);gap:22px;padding:0 24px;}}
.trust-item{display:flex;align-items:center;gap:12px;position:relative;padding-inline-start:2px;}
@media(min-width:760px){
  .trust-item:not(:first-child)::before{
    content:'';position:absolute;inset-inline-start:-11px;top:50%;transform:translateY(-50%);
    width:1px;height:32px;background:color-mix(in srgb, var(--gold) 40%, transparent);
  }
}
.trust-item .ti-icon{width:38px;height:38px;border-radius:50%;background:var(--white);display:flex;align-items:center;
  justify-content:center;flex-shrink:0;box-shadow:0 3px 10px -4px rgba(43,23,21,.4);}
.trust-item svg{width:17px;height:17px;color:var(--red);}
.trust-item span{font-size:.8rem;color:var(--page-bg-text);line-height:1.35;font-weight:400;}

/* ---------- section shell ---------- */
.section{padding:88px 24px;max-width:1320px;margin:0 auto;}
.section-head{text-align:center;max-width:660px;margin:0 auto 50px;}
.section-head h2{letter-spacing:.005em;}
.drop-cap::first-letter{font-family:var(--serif);font-size:3.6em;line-height:.78;float:left;
  padding:6px 10px 0 0;color:var(--red);font-weight:600;}
.cat-intro{max-width:700px;margin:0 auto 56px;text-align:center;}
.cat-intro-text{font-family:var(--serif);font-size:1.28rem;font-style:italic;color:var(--page-bg-text-soft);line-height:1.65;margin-bottom:18px;}
[dir="rtl"] .cat-intro-text{font-style:normal;}
.origin-tag{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border:1px solid var(--gold);border-radius:30px;
  font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-light);}
.origin-tag svg{width:13px;height:13px;}
.testimonial-grid{display:grid;grid-template-columns:1fr;gap:28px;}
@media(min-width:820px){.testimonial-grid{grid-template-columns:repeat(3,1fr);}}
.testimonial-card{padding:30px 26px;background:var(--white);border:1px solid var(--cream-2);border-radius:14px;position:relative;}
.testimonial-card .quote-mark{width:26px;height:26px;color:var(--gold);margin-bottom:14px;}
.testimonial-card p{font-family:var(--serif);font-style:italic;font-size:1.08rem;color:var(--ink);line-height:1.6;margin-bottom:18px;}
[dir="rtl"] .testimonial-card p{font-style:normal;}
.testimonial-card cite{font-style:normal;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-dim);}
.founder-note{display:grid;grid-template-columns:1fr;gap:30px;align-items:center;max-width:820px;margin:0 auto;
  background:var(--white);border:1px solid var(--cream-2);border-radius:16px;padding:36px;}
@media(min-width:700px){.founder-note{grid-template-columns:auto 1fr;text-align:start;}}
.founder-note .portrait{width:84px;height:84px;border-radius:50%;flex-shrink:0;margin:0 auto;overflow:hidden;border:1px solid var(--gold);}
.founder-note .portrait .placeholder-img{min-height:0;height:100%;}
.founder-note blockquote{font-family:var(--serif);font-style:italic;font-size:1.2rem;color:var(--ink);line-height:1.6;margin-bottom:10px;}
[dir="rtl"] .founder-note blockquote{font-style:normal;}
.founder-note cite{font-style:normal;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-dim);}
.promise-band{background:linear-gradient(180deg,var(--ink) 0%,#3A2E26 100%);position:relative;overflow:hidden;}
.promise-band::before{content:'';position:absolute;inset:0;opacity:.07;
  background-image:radial-gradient(circle,rgba(228,201,122,.6) 1px,transparent 1.4px);background-size:28px 28px;}
.promise-grid{position:relative;display:grid;grid-template-columns:1fr;gap:36px;max-width:960px;margin:0 auto;text-align:center;}
@media(min-width:760px){.promise-grid{grid-template-columns:repeat(3,1fr);}}
.promise-item svg{width:32px;height:32px;color:var(--gold-light);margin-bottom:14px;}
.promise-item h4{font-size:1.1rem;color:var(--cream);margin-bottom:8px;}
.promise-item p{color:rgba(251,246,236,.65);font-size:.9rem;}
.gift-note{display:flex;align-items:center;gap:8px;font-size:.74rem;color:var(--gold-dim);margin-top:10px;letter-spacing:.02em;}
.gift-note svg{width:14px;height:14px;flex-shrink:0;}
.section-head .eyebrow{display:block;margin-bottom:12px;}
.section-head h2{font-size:clamp(1.9rem,3.6vw,2.7rem);margin-bottom:16px;color:var(--page-bg-text);}
.section-head p{color:var(--page-bg-text-soft);font-size:1rem;}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .8s ease, transform .8s cubic-bezier(.16,1,.3,1);}
.reveal.in{opacity:1;transform:translateY(0);}

/* ---------- invitation strip ---------- */
.pillars{display:grid;grid-template-columns:1fr;gap:36px;max-width:960px;margin:0 auto;text-align:center;}
@media(min-width:760px){.pillars{grid-template-columns:repeat(3,1fr);}}
.pillar svg{width:34px;height:34px;color:var(--gold);margin-bottom:14px;}
.pillar h4{font-size:1.15rem;margin-bottom:8px;}
.pillar p{color:var(--ink-soft);font-size:.92rem;}

/* ---------- baklava showcase ---------- */
.collection-grid{display:grid;grid-template-columns:1fr;gap:40px;}
@media(min-width:900px){.collection-grid{grid-template-columns:repeat(3,1fr);}}
.collection-card{background:var(--white);border:1px solid var(--cream-2);border-radius:14px;overflow:hidden;
  box-shadow:var(--shadow-sm);transition:transform .5s cubic-bezier(.16,1,.3,1), box-shadow .5s;}
.collection-card:hover{transform:translateY(-8px);box-shadow:var(--shadow);}
.collection-card .arch-frame{border-radius:150px 150px 0 0;border:none;border-bottom:2px solid var(--gold);}
.collection-card .placeholder-img{aspect-ratio:4/5;}
.collection-body{padding:26px 24px 28px;}
.collection-body .eyebrow{color:var(--pistachio);}
.collection-body h3{font-size:1.5rem;margin:8px 0 10px;}
.collection-body p.desc{color:var(--ink-soft);font-size:.9rem;margin-bottom:18px;min-height:44px;}
.weight-toggle{display:flex;background:var(--cream-2);border-radius:30px;padding:4px;margin-bottom:16px;}
.weight-toggle button{flex:1;padding:8px 10px;border-radius:26px;font-size:.78rem;letter-spacing:.03em;color:var(--ink-soft);transition:all .3s;}
.weight-toggle button.active{background:var(--red);color:var(--cream);}
.price-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;}
.price-row .price{font-family:var(--serif);font-size:1.7rem;color:var(--red);}
.price-row .price small{font-size:.9rem;font-family:var(--sans);color:var(--ink-soft);}
.qty-row{display:flex;align-items:center;justify-content:space-between;gap:14px;}
.stepper{display:flex;align-items:center;border:1px solid var(--cream-2);border-radius:30px;overflow:hidden;}
.stepper button{width:32px;height:32px;font-size:1.1rem;color:var(--red);}
.stepper button:hover{background:var(--cream-2);}
.stepper span{width:30px;text-align:center;font-size:.92rem;}
.add-cart-btn{flex:1;}

/* ---------- category grid (compact) ---------- */
.category-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
@media(min-width:620px){.category-grid{grid-template-columns:repeat(3,1fr);gap:14px;}}
@media(min-width:1080px){.category-grid{gap:16px;}}
/* With 7 homepage categories, the 7th card sits alone on the last row —
   center it instead of leaving it stranded on one side. */
.category-grid > .category-card:nth-child(7):last-child{
  grid-column:1/-1;justify-self:center;width:100%;max-width:calc(50% - 6px);
}
@media(min-width:620px){
  .category-grid > .category-card:nth-child(7):last-child{
    grid-column:2/3;max-width:100%;
  }
}
.category-card{display:flex;align-items:center;gap:12px;background:var(--white);border:1px solid color-mix(in srgb, var(--gold) 30%, var(--cream-2));
  border-radius:14px;padding:10px;cursor:pointer;transition:transform .4s cubic-bezier(.16,1,.3,1), box-shadow .4s, border-color .4s;
  position:relative;overflow:hidden;box-shadow:0 6px 18px -12px rgba(43,23,21,.35);}
.category-card:hover{transform:translateY(-3px);box-shadow:0 12px 26px -12px rgba(43,23,21,.28);border-color:var(--gold);}
.category-card .cc-thumb{width:58px;height:58px;border-radius:50%;flex-shrink:0;overflow:hidden;border:1px solid var(--gold);
  transition:transform .5s cubic-bezier(.16,1,.3,1);}
.category-card:hover .cc-thumb{transform:scale(1.07);}
.category-card .cc-thumb .placeholder-img{min-height:0;height:100%;}
.category-card .cc-info{flex:1;min-width:0;}
.category-card h4{font-size:.86rem;margin-bottom:2px;line-height:1.2;}
.category-card .cc-desc{font-size:.7rem;color:var(--ink-soft);line-height:1.3;margin-bottom:5px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
.category-card .cc-explore{display:inline-flex;align-items:center;gap:3px;font-size:.66rem;letter-spacing:.06em;
  text-transform:uppercase;color:var(--red);font-weight:500;}
.category-card .cc-explore svg{width:10px;height:10px;transition:transform .3s;}
[dir="rtl"] .category-card .cc-explore svg{transform:scaleX(-1);}
.category-card:hover .cc-explore svg{transform:translateX(3px);}
[dir="rtl"] .category-card:hover .cc-explore svg{transform:scaleX(-1) translateX(3px);}
@media(min-width:620px){
  .category-card{padding:14px;gap:14px;}
  .category-card .cc-thumb{width:68px;height:68px;}
  .category-card h4{font-size:.94rem;}
  .category-card .cc-desc{font-size:.74rem;}
}

/* ---------- heritage band ---------- */
.heritage{background:linear-gradient(180deg,var(--red-deep),var(--red));color:var(--cream);text-align:center;position:relative;overflow:hidden;}
.heritage::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.35) 1px,transparent 1.4px);background-size:30px 30px;opacity:.08;}
.heritage-inner{position:relative;z-index:1;max-width:760px;margin:0 auto;}
.heritage blockquote{font-family:var(--serif);font-style:italic;font-size:clamp(1.4rem,3vw,2.1rem);line-height:1.5;margin:22px 0;color:var(--cream);}
[dir="rtl"] .heritage blockquote{font-style:normal;}
.heritage cite{font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gold-light);font-style:normal;}

/* ---------- craftsmanship strip ---------- */
.craft-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
@media(min-width:760px){.craft-grid{grid-template-columns:repeat(4,1fr);}}
.craft-item{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;}
.craft-item .placeholder-img{min-height:0;height:100%;}
.craft-item .label{position:absolute;bottom:0;left:0;right:0;padding:12px;background:linear-gradient(0deg,rgba(43,23,21,.75),transparent);color:#fff;font-size:.78rem;letter-spacing:.05em;}

/* ---------- branches ---------- */
.branch-grid{display:grid;grid-template-columns:1fr;gap:18px;}
@media(min-width:760px){.branch-grid{grid-template-columns:repeat(2,1fr);}}
.branch-grid.compact{gap:12px;}
@media(min-width:760px){.branch-grid.compact{grid-template-columns:repeat(4,1fr);}}
.branch-card{display:flex;gap:16px;align-items:flex-start;padding:22px;background:var(--white);border:1px solid var(--cream-2);border-radius:14px;transition:box-shadow .3s, transform .3s;}
.branch-grid.compact .branch-card{padding:16px;gap:12px;}
.branch-card:hover{box-shadow:var(--shadow-sm);transform:translateY(-3px);}
.branch-card svg{width:24px;height:24px;color:var(--gold-dim);flex-shrink:0;margin-top:2px;}
.branch-grid.compact .branch-card svg{width:20px;height:20px;}
.branch-card h4{font-size:1.05rem;margin-bottom:4px;}
.branch-grid.compact .branch-card h4{font-size:.92rem;margin-bottom:6px;}
.branch-card p{color:var(--ink-soft);font-size:.86rem;margin-bottom:8px;}
.branch-view-loc{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;letter-spacing:.04em;
  text-transform:uppercase;color:var(--red);font-weight:500;}
.branch-view-loc svg{width:10px;height:10px;color:var(--red);margin-top:0;}
[dir="rtl"] .branch-view-loc svg{transform:scaleX(-1);}

/* ---------- whatsapp cta band ---------- */
.wa-band{background:var(--cream-2);text-align:center;border-top:1px solid var(--gold-light);border-bottom:1px solid var(--gold-light);}
.wa-band-inner{display:flex;flex-direction:column;align-items:center;gap:18px;max-width:560px;margin:0 auto;}
.wa-band svg.wa-icon{width:44px;height:44px;color:#25563B;}

/* ---------- footer ---------- */
footer.site{background:var(--ink);color:var(--cream-2);padding:64px 24px 22px;position:relative;}
footer.site::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:repeating-linear-gradient(90deg,var(--gold) 0 18px, transparent 18px 30px);}
.footer-grid{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:44px;}
@media(min-width:860px){.footer-grid{grid-template-columns:1.4fr 1fr 1fr 1.2fr;}}
.footer-grid h5{font-family:var(--sans);font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-light);margin-bottom:18px;}
.footer-grid a, .footer-grid p{display:block;color:rgba(251,246,236,.7);font-size:.88rem;margin-bottom:10px;}
.footer-grid a:hover{color:var(--gold-light);}
.footer-logo b{font-family:var(--serif);color:var(--cream);font-size:1.3rem;}
.footer-social{display:flex;gap:12px;margin-top:16px;}
.footer-social a{width:32px;height:32px;border-radius:50%;border:1px solid rgba(228,201,122,.4);display:flex;align-items:center;justify-content:center;}
.footer-social svg{width:14px;height:14px;}
.footer-bottom{max-width:1320px;margin:44px auto 0;padding-top:22px;border-top:1px solid rgba(251,246,236,.12);
  display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;font-size:.76rem;color:rgba(251,246,236,.5);}

/* ---------- generic page shells (about/category/contact/gallery/wholesale) ---------- */
.page-banner{position:relative;padding:100px 24px 60px;text-align:center;
  background:linear-gradient(180deg,var(--red-deep),var(--red-bright));color:var(--cream);}
.page-banner::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.4) 1px,transparent 1.4px);background-size:26px 26px;opacity:.1;}
.page-banner .crumb{position:relative;z-index:1;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-light);opacity:.85;margin-bottom:10px;}
.page-banner h1{position:relative;z-index:1;color:var(--cream);font-size:clamp(2.1rem,4.4vw,3.1rem);}
.page-banner p{position:relative;z-index:1;color:rgba(251,246,236,.82);max-width:560px;margin:14px auto 0;}

/* ---------- compact category header (replaces big hero banner on shopping pages) ---------- */
.cat-header{padding:18px 24px 6px;max-width:1320px;margin:0 auto;}
.cat-header h1{font-size:clamp(1.5rem,3vw,2rem);margin:6px 0 6px;color:var(--page-bg-text);}
.cat-header .cat-header-desc{color:var(--page-bg-text-soft);font-size:.88rem;max-width:520px;line-height:1.5;}
[dir="rtl"] .cat-header .cat-header-desc{max-width:560px;}

.filter-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:38px;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.chip{padding:8px 16px;border:1px solid rgba(253,246,234,.35);border-radius:30px;font-size:.78rem;color:var(--page-bg-text);transition:all .3s;}
.chip.active,.chip:hover{background:var(--gold);border-color:var(--gold);color:var(--ink);}
.search-box{display:flex;align-items:center;gap:8px;border:1px solid var(--cream-2);border-radius:10px;padding:8px 16px;background:var(--white);min-width:220px;}
.search-box input{border:none;outline:none;background:none;font-family:var(--sans);font-size:.85rem;width:100%;color:var(--ink);}
.search-box svg{width:15px;height:15px;color:var(--ink-soft);flex-shrink:0;}

.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
@media(min-width:480px){.product-grid{grid-template-columns:repeat(3,1fr);gap:14px;}}
@media(min-width:860px){.product-grid{grid-template-columns:repeat(3,1fr);gap:16px;}}
@media(min-width:1160px){.product-grid{grid-template-columns:repeat(4,1fr);gap:18px;}}
.product-card{background:var(--white);border:1px solid var(--cream-2);border-radius:14px;overflow:hidden;
  transition:transform .35s cubic-bezier(.16,1,.3,1), box-shadow .35s, border-color .35s;position:relative;}
.product-card:hover{transform:translateY(-4px);box-shadow:0 12px 26px -12px rgba(43,23,21,.22);border-color:var(--gold-light);}
.product-card .placeholder-img{aspect-ratio:1/1;min-height:0;}
.pc-badge{position:absolute;top:7px;inset-inline-start:7px;z-index:2;font-size:.56rem;letter-spacing:.03em;
  text-transform:uppercase;padding:3px 8px;border-radius:10px;color:#fff;font-weight:500;}
.pc-badge.bestseller{background:var(--gold);color:var(--ink);}
.pc-badge.new{background:var(--pistachio);}
.pc-badge.featured{background:var(--red-deep);}
.wish-btn{position:absolute;top:7px;inset-inline-end:7px;width:26px;height:26px;border-radius:50%;background:rgba(255,253,249,.92);
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(43,23,21,.18);z-index:2;transition:transform .25s;}
.wish-btn:hover{transform:scale(1.14);}
.wish-btn svg{width:12px;height:12px;color:var(--red);}
.wish-btn.active svg{fill:var(--red);}
.pc-body{padding:10px 11px 11px;}
.pc-body .cat-tag{font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-dim);
  display:block;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pc-body h4{font-size:.83rem;font-weight:600;margin:0 0 2px;line-height:1.28;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.15em;}
[dir="rtl"] .pc-body h4{font-weight:700;}
.pc-body .pc-weight{font-size:.68rem;color:var(--ink-soft);margin-bottom:3px;}
.pc-shortdesc{font-size:.68rem;color:var(--ink-soft);line-height:1.35;margin-bottom:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.pc-body .price{font-family:var(--serif);color:var(--red);font-size:.98rem;font-weight:600;margin:2px 0 8px;}
.pc-price-label{font-family:var(--sans);font-size:.6rem;color:var(--ink-soft);font-weight:400;text-transform:uppercase;letter-spacing:.03em;margin-inline-end:3px;}
.pc-price-strike{text-decoration:line-through;color:var(--ink-soft);font-weight:400;font-size:.85em;margin-inline-end:5px;}
.pc-price-discounted{color:var(--red);font-weight:700;}
.pc-weight b{font-weight:600;color:var(--ink);}
.pc-clickable{cursor:pointer;}
.pc-body .btn{width:100%;padding:7px 6px;font-size:.62rem;letter-spacing:.05em;gap:4px;}
.pc-body .btn svg{width:12px;height:12px;}
.product-card .corner-bracket{width:14px;height:14px;}

/* ---------- shared: 3-across compact grid, even on mobile (used by Delight collections + Baklava) ---------- */
.delight-featured-grid, .grid-3col-mobile{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
@media(min-width:600px){.delight-featured-grid, .grid-3col-mobile{gap:14px;}}
@media(min-width:900px){.delight-featured-grid, .grid-3col-mobile{gap:18px;}}
.delight-featured-grid .corner-bracket, .grid-3col-mobile .corner-bracket{display:none;}
.delight-featured-grid .pc-body, .grid-3col-mobile .pc-body{padding:7px 6px 8px;}
.delight-featured-grid .pc-body .cat-tag, .grid-3col-mobile .pc-body .cat-tag{display:none;}
.delight-featured-grid .pc-body h4, .grid-3col-mobile .pc-body h4{font-size:.7rem;min-height:1.85em;margin-bottom:1px;}
.delight-featured-grid .pc-shortdesc, .grid-3col-mobile .pc-shortdesc{display:none;}
@media(min-width:480px){.delight-featured-grid .pc-shortdesc, .grid-3col-mobile .pc-shortdesc{display:-webkit-box;font-size:.6rem;-webkit-line-clamp:2;}}
.delight-featured-grid .pc-weight, .grid-3col-mobile .pc-weight{font-size:.58rem;margin-bottom:1px;}
.delight-featured-grid .price, .grid-3col-mobile .price{font-size:.8rem;margin:1px 0 6px;}
.delight-featured-grid .pc-price-label, .grid-3col-mobile .pc-price-label{display:none;}
.delight-featured-grid .pc-body .btn, .grid-3col-mobile .pc-body .btn{padding:6px 3px;font-size:.54rem;letter-spacing:.02em;gap:3px;}
.delight-featured-grid .pc-body .btn svg, .grid-3col-mobile .pc-body .btn svg{width:10px;height:10px;}
.delight-featured-grid .wish-btn, .grid-3col-mobile .wish-btn{width:20px;height:20px;top:5px;inset-inline-end:5px;}
.delight-featured-grid .wish-btn svg, .grid-3col-mobile .wish-btn svg{width:10px;height:10px;}
.delight-featured-grid .pc-badge, .grid-3col-mobile .pc-badge{font-size:.48rem;padding:2px 5px;top:5px;inset-inline-start:5px;}
.grid-3col-mobile .product-card{height:100%;}


/* ---------- delight: regular varieties (compact minimal menu) ---------- */
.delight-mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
@media(min-width:600px){.delight-mini-grid{gap:12px;}}
.delight-mini-card{position:relative;text-align:center;background:var(--white);border:1px solid var(--cream-2);
  border-radius:10px;padding:8px 5px 9px;cursor:pointer;transition:box-shadow .3s ease, transform .3s ease, border-color .3s;}
.delight-mini-card:hover{transform:translateY(-2px);box-shadow:0 8px 18px -10px rgba(43,23,21,.22);border-color:var(--gold-light);}
.delight-mini-thumb{width:56px;height:56px;border-radius:8px;overflow:hidden;margin:0 auto 6px;}
.delight-mini-thumb .placeholder-img{min-height:0;height:100%;}
.delight-mini-thumb .placeholder-img span{display:none;}
.delight-mini-name{font-size:.66rem;line-height:1.25;color:var(--ink);margin-bottom:3px;font-weight:500;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2em;}
.delight-mini-meta{font-size:.6rem;color:var(--ink-soft);margin-bottom:7px;}
.delight-mini-meta b{color:var(--red);font-family:var(--serif);font-size:.72rem;font-weight:600;}
.delight-mini-add{width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;display:flex;
  align-items:center;justify-content:center;margin:0 auto;transition:transform .25s ease, background .3s ease;}
.delight-mini-add:hover{background:var(--red-deep);transform:scale(1.12);}
.delight-mini-add svg{width:11px;height:11px;}
.delight-mini-wish{position:absolute;top:5px;inset-inline-end:5px;width:18px;height:18px;display:flex;
  align-items:center;justify-content:center;z-index:2;}
.delight-mini-wish svg{width:11px;height:11px;color:var(--red);}
.delight-mini-wish.active svg{fill:var(--red);}
.product-card .corner-bracket.tl,.product-card .corner-bracket.tr{top:6px;}
.product-card .corner-bracket.bl,.product-card .corner-bracket.br{bottom:6px;}
.product-card .corner-bracket.tl,.product-card .corner-bracket.bl{inset-inline-start:6px;}
.product-card .corner-bracket.tr,.product-card .corner-bracket.br{inset-inline-end:6px;}

/* about page */
.about-story{display:grid;grid-template-columns:1fr;gap:40px;align-items:center;}
@media(min-width:860px){.about-story{grid-template-columns:1fr 1fr;}}
.about-story .placeholder-img{min-height:380px;border-radius:14px;}
.about-story p{color:var(--ink-soft);margin-bottom:16px;}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px;text-align:center;}
.stat-row .num{font-family:var(--serif);font-size:2.2rem;color:var(--gold-light);}
.stat-row .lbl{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--page-bg-text-soft);}

/* contact */
.contact-grid{display:grid;grid-template-columns:1fr;gap:36px;}
@media(min-width:900px){.contact-grid{grid-template-columns:1fr 1fr;}}
.form-field{margin-bottom:18px;}
.form-field label{display:block;font-size:.78rem;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:6px;}
.form-field input,.form-field textarea,.form-field select{
  width:100%;padding:12px 14px;border:1px solid var(--cream-2);border-radius:10px;background:var(--white);
  font-family:var(--sans);font-size:.9rem;color:var(--ink);outline:none;transition:border-color .3s;}
.form-field input:focus,.form-field textarea:focus,.form-field select:focus{border-color:var(--gold);}

/* gallery */
.gallery-grid{columns:2;column-gap:16px;}
@media(min-width:760px){.gallery-grid{columns:3;}}
.gallery-grid .placeholder-img{margin-bottom:16px;border-radius:10px;break-inside:avoid;}

/* wholesale */
.wholesale-perks{display:grid;grid-template-columns:1fr;gap:24px;}
@media(min-width:760px){.wholesale-perks{grid-template-columns:repeat(3,1fr);}}
.perk{padding:24px;border:1px solid var(--cream-2);border-radius:10px;background:var(--white);}
.perk svg{width:28px;height:28px;color:var(--gold-dim);margin-bottom:12px;}
.perk h4{font-size:1.05rem;margin-bottom:6px;}
.perk p{color:var(--ink-soft);font-size:.88rem;}

/* ---------- cart drawer ---------- */
.overlay{position:fixed;inset:0;background:rgba(43,23,21,.5);z-index:90;opacity:0;pointer-events:none;transition:opacity .35s;}
.overlay.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;inset-inline-end:0;width:100%;max-width:420px;height:100%;background:var(--cream);z-index:95;
  transform:translateX(105%);transition:transform .45s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;}
[dir="rtl"] .drawer{transform:translateX(-105%);}
.drawer.open{transform:translateX(0);}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:22px 22px 16px;border-bottom:1px solid var(--cream-2);}
.drawer-head h3{font-size:1.3rem;}
.drawer-body{flex:1;overflow-y:auto;padding:18px 22px;}
.cart-line{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--cream-2);}
.cart-line .thumb{width:64px;height:64px;border-radius:10px;flex-shrink:0;overflow:hidden;}
.cart-line .thumb .placeholder-img{min-height:0;height:100%;}
.cart-line .info{flex:1;}
.cart-line .info h5{font-size:.9rem;margin-bottom:2px;}
.cart-line .info .meta{font-size:.74rem;color:var(--ink-soft);margin-bottom:8px;}
.cart-line .row2{display:flex;align-items:center;justify-content:space-between;}
.cart-line .remove{font-size:.72rem;color:var(--red);text-decoration:underline;}
.empty-state{text-align:center;padding:60px 20px;color:var(--page-bg-text-soft);}
.empty-state svg{width:48px;height:48px;color:var(--cream-2);margin-bottom:16px;}
.drawer-foot{padding:20px 22px 26px;border-top:1px solid var(--cream-2);}
.tot-row{display:flex;justify-content:space-between;font-size:.86rem;color:var(--ink-soft);margin-bottom:8px;}
.tot-row.grand{font-size:1.15rem;color:var(--ink);font-family:var(--serif);margin:12px 0 18px;}
.tot-row.grand b{color:var(--red);}
.drawer-actions{display:flex;flex-direction:column;gap:10px;}

/* toast */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);z-index:120;
  background:var(--ink);color:var(--cream);padding:13px 26px;border-radius:30px;font-size:.84rem;
  opacity:0;pointer-events:none;transition:all .4s cubic-bezier(.16,1,.3,1);display:flex;align-items:center;gap:10px;
  border:1px solid var(--gold);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast svg{width:16px;height:16px;color:var(--gold-light);}

/* mobile bottom bar */
.mobile-bar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:70;background:var(--white);
  border-top:1px solid var(--cream-2);box-shadow:0 -6px 24px rgba(43,23,21,.08);padding:8px 6px;justify-content:space-around;}
@media(min-width:960px){.mobile-bar{display:none;}}
.mobile-bar button, .mobile-bar a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.62rem;color:var(--ink-soft);position:relative;padding:6px 10px;}
.mobile-bar svg{width:20px;height:20px;}
.mobile-bar .mb-whatsapp svg{color:#25D366;}
body{padding-bottom:0;}
@media(min-width:960px){.mobile-bar{display:none;}}
@media(max-width:959px){ body #app{padding-bottom:84px;} }

/* skeleton shimmer for placeholders on first load */
.placeholder-img.shimmer{position:relative;overflow:hidden;}
.placeholder-img.shimmer::after{content:'';position:absolute;inset:0;
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);
  transform:translateX(-100%);animation:shimmer 2.2s ease-in-out infinite;}
@keyframes shimmer{to{transform:translateX(100%);}}

.two-col-text{display:grid;grid-template-columns:1fr;gap:30px;}
@media(min-width:820px){.two-col-text{grid-template-columns:repeat(2,1fr);}}

/* ---------- search overlay ---------- */
.search-overlay{position:fixed;inset:0;z-index:110;background:rgba(43,23,21,.55);opacity:0;pointer-events:none;transition:opacity .35s ease;}
.search-overlay.open{opacity:1;pointer-events:auto;}
.search-overlay .panel{background:var(--cream);border-bottom:1px solid var(--gold);padding:90px 24px 40px;
  transform:translateY(-24px);transition:transform .45s cubic-bezier(.16,1,.3,1);max-height:88vh;overflow-y:auto;}
.search-overlay.open .panel{transform:translateY(0);}
.search-overlay .inner{max-width:820px;margin:0 auto;}
.search-overlay .field{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--ink);padding-bottom:14px;}

.product-card .placeholder-img.real{
  position:relative;
  width:100%;
  height:auto;
  min-height:0;
  aspect-ratio:1 / 1;
  box-sizing:border-box;
  padding:clamp(10px, 3vw, 22px);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 50% 42%,
      rgba(255,253,249,.98) 0%,
      rgba(255,253,249,.94) 58%,
      rgba(239,227,203,.30) 100%
    );
}

.product-card .placeholder-img.real .real-img{
  display:block;
  width:100%;
  height:100%;
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  object-position:center center;
  transform:none;
  transition:
    transform .55s cubic-bezier(.16,1,.3,1),
    filter .35s ease;
}

.product-card:hover .placeholder-img.real .real-img{
  transform:scale(1.035);
}

/* Compact grids: still usable on small phones */
.delight-featured-grid .product-card .placeholder-img.real,
.grid-3col-mobile .product-card .placeholder-img.real{
  padding:8px;
}

/* ---------- Product card refinement ---------- */
.product-card{
  min-width:0;
  overflow:hidden;
  box-shadow:0 1px 0 rgba(43,23,21,.025);
  transition:
    transform .32s cubic-bezier(.16,1,.3,1),
    box-shadow .32s ease,
    border-color .32s ease;
}

.product-card:hover{
  transform:translateY(-3px);
  box-shadow:0 14px 34px -18px rgba(43,23,21,.30);
  border-color:rgba(201,162,74,.55);
}

/* Prevent product text area from being squeezed by imagery */
.product-card .pc-body{
  position:relative;
  min-width:0;
  box-sizing:border-box;
}

.product-card .pc-body h4,
.product-card .pc-body .pc-shortdesc,
.product-card .pc-body .pc-weight,
.product-card .pc-body .price{
  overflow-wrap:anywhere;
}

/* Keep typography elegant rather than oversized */
.product-card .pc-body h4{
  line-height:1.35;
}

/* ---------- Buttons ---------- */
.product-card .btn.btn-primary{
  transition:
    transform .25s ease,
    box-shadow .25s ease,
    background .25s ease,
    border-color .25s ease;
}

.product-card .btn.btn-primary:hover{
  transform:translateY(-1px);
  box-shadow:0 7px 16px -10px rgba(43,23,21,.42);
}

/* ---------- Soft brand-gold treatment for active filter chips ---------- */
.chip.active,
.chip:hover{
  background:
    linear-gradient(
      135deg,
      var(--gold),
      var(--gold-dim)
    );
  border-color:var(--gold);
  color:var(--ink);
}

/* ---------- Subtle premium gold details ---------- */
.divider .line{
  opacity:.72;
}

.pc-badge{
  box-shadow:0 2px 8px rgba(43,23,21,.12);
}

/* ---------- Prevent accidental page-width overflow ---------- */
html,
body{
  max-width:100%;
}

img{
  max-width:100%;
}

/* ---------- Small mobile phones ---------- */
@media (max-width:479px){
  .product-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .product-card{
    border-radius:12px;
  }

  .product-card .placeholder-img.real{
    padding:9px;
    aspect-ratio:1 / 1;
  }

  .product-card .pc-body{
    padding:9px 9px 10px;
  }

  .product-card .pc-body h4{
    font-size:.78rem;
    line-height:1.32;
    min-height:2.06em;
  }

  .product-card .pc-body .pc-shortdesc{
    font-size:.66rem;
    line-height:1.4;
  }

  .product-card .pc-body .pc-weight{
    font-size:.64rem;
  }

  .product-card .pc-body .price{
    font-size:.91rem;
    margin-bottom:7px;
  }

  .product-card .pc-body .btn{
    min-height:34px;
    padding:7px 5px;
  }

  .product-card .wish-btn{
    width:25px;
    height:25px;
    top:6px;
    inset-inline-end:6px;
  }

  .product-card .pc-badge{
    top:6px;
    inset-inline-start:6px;
  }

  /* Avoid tiny 3-column product cards on phones */
  .delight-featured-grid,
  .grid-3col-mobile{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .delight-featured-grid .product-card .placeholder-img.real,
  .grid-3col-mobile .product-card .placeholder-img.real{
    padding:7px;
  }

  .delight-featured-grid .product-card .pc-body,
  .grid-3col-mobile .product-card .pc-body{
    padding:8px 8px 9px;
  }

  .delight-featured-grid .product-card .pc-body h4,
  .grid-3col-mobile .product-card .pc-body h4{
    font-size:.68rem;
  }

  .search-box{
    width:100%;
    min-width:0;
    box-sizing:border-box;
  }
}

/* ---------- Tablet / larger phones ---------- */
@media (min-width:480px) and (max-width:859px){
  .product-card .placeholder-img.real{
    padding:12px;
  }

  .delight-featured-grid,
  .grid-3col-mobile{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}

/* ---------- Touch devices: don't leave hover transforms "stuck" ---------- */
@media (hover:none){
  .product-card:hover{
    transform:none;
    box-shadow:0 1px 0 rgba(43,23,21,.025);
  }

  .product-card:hover .placeholder-img.real .real-img{
    transform:none;
  }

  .product-card .btn.btn-primary:hover{
    transform:none;
  }
}

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion:reduce){
  .product-card,
  .product-card .placeholder-img.real .real-img,
  .product-card .btn.btn-primary{
    transition:none !important;
  }
}

/* =========================================================
   1. SOFT TRANSPARENT RED CATEGORY/PAGE BANNER
   Same brand red hue (--red-deep / --red-bright), now a
   semi-transparent, slightly glass-like layer instead of a
   solid, heavy fill. Scoped to .page-banner only — the site's
   primary red variables and every other red element are
   untouched.
   ========================================================= */
.page-banner{
  background-color:var(--red-deep);
  background:linear-gradient(180deg, color-mix(in srgb, var(--red-deep) 88%, transparent) 0%, color-mix(in srgb, var(--red-soft-bg) 75%, transparent) 100%);
  -webkit-backdrop-filter:blur(7px) saturate(1.12);
  backdrop-filter:blur(7px) saturate(1.12);
  border-bottom:1px solid color-mix(in srgb, var(--gold) 35%, transparent);
}

/* =========================================================
   2. SUBTLE PREMIUM VISUAL DETAILS
   Small, restrained touches only — no new sections, no new
   layout, nothing structural. Purely refined polish.
   ========================================================= */

/* Slightly more breathing room between sections */
.section{ padding:98px 24px; }

/* Thin, tasteful gold divider with a restrained Ottoman-style
   flourish beneath important section headings */
.section-head h2::after{
  content:'\2726';
  display:block;
  margin-top:16px;
  color:var(--gold);
  font-size:.72rem;
  letter-spacing:.4em;
  opacity:.85;
}

/* Slightly more sophisticated resting shadow on product cards
   (hover states were already refined above) */
.product-card{
  box-shadow:0 2px 10px -8px rgba(43,23,21,.18);
}

/* More polished button hover states site-wide */
.btn-outline:hover{
  box-shadow:0 6px 16px -10px rgba(43,23,21,.35);
  transform:translateY(-2px);
}
.btn-gold:hover{
  box-shadow:0 6px 16px -10px rgba(201,162,74,.5);
}
.btn{
  transition:background .3s ease, color .3s ease, border-color .3s ease,
    transform .25s cubic-bezier(.16,1,.3,1), box-shadow .25s ease;
}
</style>

function generateOrderId(){
  const t36 = Date.now().toString(36).toUpperCase();
  const rand = Math.random().toString(36).slice(2,7).toUpperCase();
  return `TB-${t36}-${rand}`;
}

function saveOrderRecord(order){
  try{
    const all = JSON.parse(localStorage.getItem('tb_orders') || '{}');
    all[order.orderId] = order;
    localStorage.setItem('tb_orders', JSON.stringify(all));
  }catch(e){}
}
function getOrderRecord(orderId){
  try{
    const all = JSON.parse(localStorage.getItem('tb_orders') || '{}');
    return all[orderId] || null;
  }catch(e){ return null; }
}

function placeholder(labelEn, labelAr, extra, imageKey){
  const label = lang==='ar'?labelAr:labelEn;
  const src = imageKey && PRODUCT_IMAGES[imageKey];
  if(src){
    return `<div class="placeholder-img real ${extra||''}"><img class="real-img" src="${src}" alt="${String(label).replace(/"/g,'&quot;')}" loading="lazy"></div>`;
  }
  return `<div class="placeholder-img shimmer ${extra||''}">${ICONS.star6}<span>${label}</span></div>`;
}

function copyDinarakAlias(){
  const pi = window.__dinarakPayInstructions || {};
  if(!pi.alias) return;
  const done = ()=> showToast(lang==='ar'?'تم نسخ الـ Alias':'Alias copied');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(pi.alias).then(done).catch(()=>{});
  }
}

function copyDinarakAmount(){
  const pi = window.__dinarakPayInstructions || {};
  if(pi.amount===undefined || pi.amount===null) return;
  const done = ()=> showToast(lang==='ar'?'تم نسخ المبلغ':'Amount copied');
  const raw = Number(pi.amount).toFixed(2);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(raw).then(done).catch(()=>{});
  }
}

  const phone = phoneEl ? phoneEl.value.trim() : '';
  const address = addrEl ? addrEl.value.trim() : '';
  if(!name || !phone || !address){ showToast(t().requiredField); return null; }
  const rawNotes = (document.getElementById('coNotes')||{}).value || '';
  const regionLabel = deliveryRegion==='other'
    ? (lang==='ar'?'باقي المحافظات':'Other governorates')
    : (lang==='ar'?'عمان وإربد':'Amman & Irbid');
  const deliveryTag = lang==='ar'
    ? `منطقة التوصيل: ${regionLabel} (${fmtPrice(cartDelivery())})`
    : `Delivery area: ${regionLabel} (${fmtPrice(cartDelivery())})`;
  const notes = [deliveryTag, rawNotes].filter(Boolean).join(' — ');
  return { name, phone, address, notes };
}

function buildPendingOrder(customer, paymentMethod){
  const orderId = generateOrderId();
  const order = {
    orderId,
    status: ORDER_STATUS.PENDING,
    paymentMethod: paymentMethod || null, // 'cod' | null (Dinarak path leaves this null)
    amount: cartTotal(),
    currency: 'JOD',
    customer,
    items: cart.map(l=>({ nameEn:l.nameEn, nameAr:l.nameAr, qty:l.qty, price:l.price, weight:l.weight, weightAr:l.weightAr })),
    transactionReference: null,
    createdAt: new Date().toISOString(),
  };
  saveOrderRecord(order);
  return order;
}

// Manual order path (cash on delivery) — this is REAL/working today. Not a
// payment gateway; the order is only truly confirmed once the merchant
// contacts the customer. The order is posted to the backend, which both
// records it for the admin panel AND automatically sends the merchant a
// WhatsApp notification (see backend-scaffold/services/whatsappNotifier.js)
// — no action required from the customer.
function submitManualOrder(){
  const customer = validateCheckoutForm();
  if(!customer) return;
  const order = buildPendingOrder(customer, 'cod');
  checkoutOrderNumber = order.orderId;
  cart = [];
  closeCheckout();
  go('orderStatus', order.orderId);
  // Best-effort: never blocks or fails the checkout for the customer, even
  // if the backend is unreachable.
  if(DINARAK_INTEGRATION.backendBaseUrl){
    const base = DINARAK_INTEGRATION.backendBaseUrl.replace(/\/+$/, '');
    fetch(`${base}/api/orders`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ orderId: order.orderId, amount: order.amount, currency: order.currency, customer: order.customer, items: order.items, paymentMethod: 'cod' })
    }).catch(()=>{});
  }
}

// Dinarak (CliQ) online payment path — INTENTIONALLY NOT FUNCTIONAL YET.
// This never fakes success. It only creates a PENDING order and clearly
// tells the customer online payment isn't connected yet.
function payWithDinarak(){
  const customer = validateCheckoutForm();
  if(!customer) return;
  const order = buildPendingOrder(customer);
  checkoutOrderNumber = order.orderId;

  if(!DINARAK_INTEGRATION.configured || !DINARAK_INTEGRATION.backendBaseUrl){
    order.status = ORDER_STATUS.FAILED;
    order.failureReason = 'gateway_not_configured';
    saveOrderRecord(order);
    closeCheckout();
    go('orderStatus', order.orderId);
    return;
  }

  // Real flow once a backend exists (kept here so the moment the backend URL
  // above is filled in, this starts working with zero further changes).
  // Two calls to match the backend's actual API: first create the order,
  // then ask it to start the Dinarak payment — see backend-scaffold/README.md.
  checkoutStep = 'dinarak_processing';
  renderCheckoutModal();
  const dinarakBase = DINARAK_INTEGRATION.backendBaseUrl.replace(/\/+$/, '');
  fetch(`${dinarakBase}/api/orders`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ orderId: order.orderId, amount: order.amount, currency: order.currency, customer: order.customer, items: order.items })
  })
  .then(r=>r.json())
  .then(()=> fetch(`${dinarakBase}/api/orders/${order.orderId}/pay/dinarak`, { method:'POST' }))
  .then(r=>r.json())
  .then(data=>{
    // Expected shape from OUR backend (not invented Dinarak fields):
    // { redirectUrl?: string } or { qrImageUrl?: string } or
    // { payInstructions?: {alias, amount, currency, note} } — the current
    // backend returns payInstructions (manual CliQ transfer + reconciliation,
    // since Dinarak has not documented a push/redirect payment endpoint).
    if(data.redirectUrl){ window.location.href = data.redirectUrl; return; }
    if(data.qrImageUrl){
      order.status = ORDER_STATUS.PENDING; saveOrderRecord(order);
      window.__dinarakQr = data.qrImageUrl; checkoutStep='dinarak_qr'; renderCheckoutModal();
      return;
    }
    if(data.payInstructions){
      order.status = ORDER_STATUS.PENDING; saveOrderRecord(order);
      window.__dinarakPayInstructions = data.payInstructions;
      checkoutStep = 'dinarak_instructions';
      renderCheckoutModal();
      startDinarakPolling(order.orderId);
      return;
    }
    order.status = ORDER_STATUS.FAILED; order.failureReason = data.error || 'unknown'; saveOrderRecord(order);
    closeCheckout(); go('orderStatus', order.orderId);
  })
  .catch(()=>{
    order.status = ORDER_STATUS.FAILED; order.failureReason = 'network_error'; saveOrderRecord(order);
    closeCheckout(); go('orderStatus', order.orderId);
  });
}

// While an order sits PENDING_PAYMENT after a Dinarak flow starts (customer
// is looking at the transfer instructions), the frontend polls our own
// backend — never Dinarak directly, never trusting a client-entered ID — to
// find out once the backend has reconciled the incoming transfer.
function pollOrderStatus(orderId){
  if(!DINARAK_INTEGRATION.backendBaseUrl) return;
  const dinarakBase = DINARAK_INTEGRATION.backendBaseUrl.replace(/\/+$/, '');
  fetch(`${dinarakBase}/api/orders/${orderId}/status`).then(r=>r.json()).then(data=>{
    if(!data || !data.status) return;
    const order = getOrderRecord(orderId) || { orderId };
    order.status = data.status;
    order.transactionReference = data.transactionReference || order.transactionReference || null;
    saveOrderRecord(order);
    if(data.status === 'PAID' || data.status === 'FAILED' || data.status === 'EXPIRED'){
      stopDinarakPolling();
      closeCheckout();
      go('orderStatus', orderId);
    }
  }).catch(()=>{});
}

// Auto-poll while the customer sits on the "transfer + we're checking"
// screen, so they don't have to tap "Check now" themselves.
let dinarakPollTimer = null;
function startDinarakPolling(orderId){
  stopDinarakPolling();
  pollOrderStatus(orderId); // immediate check, don't wait for the first interval tick
  dinarakPollTimer = setInterval(()=>pollOrderStatus(orderId), 6000);
}
function stopDinarakPolling(){
  if(dinarakPollTimer){ clearInterval(dinarakPollTimer); dinarakPollTimer = null; }
}

/* ---------- reusable weight-pairing grouping layer ----------
   Groups a flat list of product objects (each with an `en` name
   and a `weightEn` label) into same-product pairs, matched by
   normalized product identity — never by array position.
   Products with no matching counterpart are returned separately
   as unmatched, preserving their original order. */
function normalizeProductIdentity(name){
  return (name || '').toString().trim().toLowerCase().replace(/\s+/g,' ');
}
function weightSortRank(p){
  // Heavier/larger weight renders first within a pair (e.g. 1kg before 0.5kg).
  // Falls back to price (higher price = larger portion) when weight text is ambiguous.
  const w = (p.weightEn || '').toLowerCase();
  const num = parseFloat(w.replace(/[^\d.]/g, ''));
  if(!isNaN(num)){
    // Normalize units: a plain-gram value like "550g" has a bigger raw
    // number than "1 KG" even though it's a smaller portion — convert
    // gram values down to kilograms so the comparison is apples-to-apples.
    const isGrams = /g/.test(w) && !/kg/.test(w);
    return isGrams ? num/1000 : num;
  }
  return p.price || 0;
}
function groupProductWeightPairs(items){
  const groups = new Map();
  items.forEach(p=>{
    const key = normalizeProductIdentity(p.en);
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(p);
  });
  const pairs = [];
  const unmatched = [];
  groups.forEach(group=>{
    if(group.length >= 2){
      const sorted = group.slice().sort((a,b)=> weightSortRank(b) - weightSortRank(a));
      pairs.push(sorted.slice(0,2));
      // any extra same-name items beyond a pair fall back to unmatched
      unmatched.push(...sorted.slice(2));
    } else {
      unmatched.push(...group);
    }
  });
  return { pairs, unmatched };
}

function setWeight(id,w){ weightSel[id]=w; renderApp(); }
function changeQty(id,delta){ qtySel[id]=Math.max(1, (qtySel[id]||1)+delta); renderApp(); }

function addBaklavaToCart(id){
  const c = BAKLAVA_COLLECTIONS.find(x=>x.id===id);
  const w = weightSel[id]; const qty = qtySel[id];
  const price = w==='1'?c.p1:c.p05;

  const imgKey = {sultan:'baklavaSultan', ottoman:'baklavaClean', palace:'baklavaPalace'}[id];
  const existing = cart.find(l=>l.key===key);
  if(existing){ existing.qty += qty; } else {
    cart.push({key, nameEn:c.en, nameAr:c.ar, price, qty, weight: w==='1'?T.en.weight1:baklavaWeight05En(c), weightAr: w==='1'?T.ar.weight1:baklavaWeight05Ar(c), cat:'baklava', imgKey});
  }
  qtySel[id]=1;
  showToast(t().added);
  renderApp();
}

function addSimpleToCart(catId, en, ar, price, imgKey, weightEn, weightAr){
  const key = catId+'-'+en+(weightEn?'-'+weightEn:'');
  const existing = cart.find(l=>l.key===key);
  if(existing){ existing.qty += 1; } else {
    cart.push({key, nameEn:en, nameAr:ar, price, qty:1, weight:weightEn||'', weightAr:weightAr||'', cat:catId, imgKey});
  }
  showToast(t().added);
  renderApp();
}

function removeFromCart(key){ cart = cart.filter(l=>l.key!==key); renderApp(); }
function changeCartQty(key, delta){
  const line = cart.find(l=>l.key===key);
  if(!line) return;
  line.qty = Math.max(1, line.qty+delta);
  renderApp();
}

function toggleWish(catId, en, ar, price, weightEn, weightAr){
  const key = wishKey(catId, en, weightEn);
  if(wishlist.has(key)){ wishlist.delete(key); showToast(t().removed); }
  else { wishlist.add(key); showToast(t().savedWish); }

  if(route && route.name === 'wishlist'){
    // the wishlist page's own list must restructure (item disappears) when removed
    renderApp();
    return;
  }
  // everywhere else: update just this heart icon + the count badges in place —
  // no full re-render, so scroll position is never disturbed
  document.querySelectorAll('[data-wish-key]').forEach(btn=>{
    if(btn.getAttribute('data-wish-key') === key) btn.classList.toggle('active', wishlist.has(key));
  });
  document.querySelectorAll('.wish-count-badge').forEach(b=>{
    b.textContent = wishlist.size || '';
    b.style.display = wishlist.size ? '' : 'none';
  });
}

/* Promotional discount — applies only to cart lines whose category (l.cat)
   is in DISCOUNT_CATEGORIES (baklava + Turkish delight/"راحة"), but is
   shown and deducted as ONE line against the order's overall total (not
   as a per-item price change). To turn it off, set SITE_DISCOUNT_PERCENT
   to 0 — the discount row/banner simply won't render. To change which
   categories qualify, edit DISCOUNT_CATEGORIES (category ids are defined
   in CATEGORIES above — e.g. 'baklava', 'delight'). */
const SITE_DISCOUNT_PERCENT = 20;
const DISCOUNT_CATEGORIES = ['baklava','delight'];
function cartSubtotal(){ return cart.reduce((s,l)=>s+l.price*l.qty,0); }
function discountEligibleSubtotal(){ return cart.filter(l=>DISCOUNT_CATEGORIES.includes(l.cat)).reduce((s,l)=>s+l.price*l.qty,0); }
function cartDiscount(){ return SITE_DISCOUNT_PERCENT>0 ? discountEligibleSubtotal()*(SITE_DISCOUNT_PERCENT/100) : 0; }
function cartSubtotalAfterDiscount(){ return cartSubtotal()-cartDiscount(); }
// Delivery pricing: two flat regional tiers, chosen by the customer at
// checkout (the "delivery area" dropdown, next to the address field) —
// replaces the old flat/free-over-40 rule with the merchant's real policy.
const DELIVERY_RATES = { amman_irbid: 3, other: 5 };
let deliveryRegion = 'amman_irbid'; // default selection shown in the checkout form
function setDeliveryRegion(v){
  deliveryRegion = (v === 'other') ? 'other' : 'amman_irbid';
  renderCheckoutModal();
}
function cartDelivery(){
  if(cart.length===0) return 0;
  return DELIVERY_RATES[deliveryRegion] ?? DELIVERY_RATES.amman_irbid;
}
function cartTotal(){ return cartSubtotalAfterDiscount()+cartDelivery(); }

// Per-product price shown on baklava/delight product cards: the original
// price with a strikethrough, followed by the discounted price in the
// accent color. Purely visual — addSimpleToCart still adds the item at its
// full price; cartDiscount() above is what actually applies the 20% off at
// the cart/checkout level (this just previews it on the card).
function productPriceDisplay(catId, price){
  if(SITE_DISCOUNT_PERCENT>0 && DISCOUNT_CATEGORIES.includes(catId)){
    const discPrice = price * (1 - SITE_DISCOUNT_PERCENT/100);
    return `<span class="pc-price-strike">${fmtPrice(price)}</span><span class="pc-price-discounted">${fmtPrice(discPrice)}</span>`;
  }
  return fmtPrice(price);
}

function buildWhatsAppOrderLink(orderId){
  const lines = cart.map(l=> `- ${lang==='ar'?l.nameAr:l.nameEn} ${lang==='ar'?(l.weightAr||''):(l.weight||'')} x${l.qty} — ${fmtPrice(l.price*l.qty)}`);
  const header = lang==='ar' ? 'مرحبًا، أرغب بطلب التالي من القرية التركية:' : 'Hello, I would like to order the following from Turkish Bazaar:';
  const orderLine = orderId ? (lang==='ar'?`رقم الطلب: #${orderId}`:`Order #${orderId}`) : '';
  const totalLine = (lang==='ar'?'الإجمالي: ':'Total: ') + fmtPrice(cartTotal());
  const msg = [header, orderLine, '', ...lines, '', totalLine].filter(Boolean).join('\n');
  return `https://wa.me/${SOCIAL.whatsapp1}?text=${encodeURIComponent(msg)}`;
}

// "Send Order via WhatsApp" (cart drawer button) — unlike the old version,
// this now ALSO records the order the same way "Complete Order" does, so it
// shows up in the admin panel and triggers the merchant's WhatsApp/push
// notification, before opening the WhatsApp chat itself. No name/phone/
// address form is shown here (that's the point of this faster path), so the
// order is saved with placeholder customer info — real details arrive in
// the WhatsApp chat the customer is about to open.
function sendOrderViaWhatsApp(){
  if(cart.length===0){ showToast(lang==='ar'?'سلتك فارغة':'Your cart is empty'); return; }
  const orderId = generateOrderId();
  const waLink = buildWhatsAppOrderLink(orderId);
  const order = {
    orderId,
    status: ORDER_STATUS.PENDING,
    paymentMethod: 'whatsapp',
    amount: cartTotal(),
    currency: 'JOD',
    customer: {
      name: lang==='ar' ? 'طلب عبر واتساب' : 'WhatsApp order',
      phone: '',
      address: '',
      notes: lang==='ar' ? 'سيتم إرسال بيانات الزبون عبر محادثة واتساب' : 'Customer details will arrive via the WhatsApp chat',
    },
    items: cart.map(l=>({ nameEn:l.nameEn, nameAr:l.nameAr, qty:l.qty, price:l.price, weight:l.weight, weightAr:l.weightAr })),
    transactionReference: null,
    createdAt: new Date().toISOString(),
  };
  saveOrderRecord(order);
  // Best-effort, same pattern as submitManualOrder(): never blocks opening
  // WhatsApp for the customer, even if the backend is unreachable.
  if(DINARAK_INTEGRATION.backendBaseUrl){
    const base = DINARAK_INTEGRATION.backendBaseUrl.replace(/\/+$/, '');
    fetch(`${base}/api/orders`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ orderId: order.orderId, amount: order.amount, currency: order.currency, customer: order.customer, items: order.items, paymentMethod: 'whatsapp' })
    }).catch(()=>{});
  }
  window.open(waLink, '_blank');
  cart = [];
  closeCart();
  renderApp();
}

/* ============================= ROUTER ============================= */
let navHistory = [];
function go(name, param, _skipHistory){
  if(!_skipHistory && route && (route.name!==name || route.param!==param)){
    navHistory.push({name:route.name, param:route.param});
    if(navHistory.length>20) navHistory.shift();
    try{ history.pushState({name, param: param||null}, ''); }catch(e){}
  }
  const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const currentMain = document.querySelector('#app main');
  if(currentMain && !prefersReduced){
    currentMain.classList.add('fade-out');
    window.scrollTo({top:0, behavior:'smooth'});
    setTimeout(()=>{
      route = {name, param: param||null};
      renderApp();
      const newMain = document.querySelector('#app main');
      if(newMain){
        newMain.classList.add('fade-out');
        requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ newMain.classList.remove('fade-out'); }); });
      }
    }, 260);
  } else {
    route = {name, param: param||null};
    window.scrollTo({top:0, behavior:'smooth'});
    renderApp();
  }
}
function goBack(){
  if(navHistory.length===0){ go('home'); return; }
  try{ history.back(); }catch(e){ const prev = navHistory.pop(); go(prev.name, prev.param, true); }
}
function backButton(){
  if(navHistory.length===0) return '';
  const d = t();
  return `<button class="back-btn" onclick="goBack()">${ICONS.arrowRight}<span>${lang==='ar'?'رجوع':'Back'}</span></button>`;
}

function setLang(l){

}

  const app = document.getElementById('app');
  app.innerHTML = renderPromoBanner() + renderHeader() + `<main>${pageContent()}</main>` + renderFooter() + renderMobileBar();
  renderMobileNav();
  renderCartDrawer();
  if(searchOpen) renderSearchOverlay();
  if(accountOpen) renderAccountPanel();
  if(quickViewProduct) renderQuickViewModal();
  if(checkoutOpen) renderCheckoutModal();
  renderWaMenu();
  setupReveal();
  syncHeaderSpacer();
  applyCategoryTheme();
  if(route.name==='home') initHeroTransition(); else clearHeroTimers();
}

/* ---------- hero intro transition: photo shows briefly, then in the
   SAME hero space the showcase marquee fades in and stays. The marquee
   itself is pure CSS (always animating, even while hidden at opacity:0),
   so there's nothing to "start" — this timer only handles the crossfade. ---------- */
let heroTimerIds = [];
function clearHeroTimers(){
  heroTimerIds.forEach(id=>{ clearTimeout(id); clearInterval(id); });
  heroTimerIds = [];
}
function initHeroTransition(){
  clearHeroTimers();
  const stage = document.getElementById('heroPhotoStage');
  const split = document.getElementById('heroSplit');
  if(!stage || !split) return;

  const leftEls = Array.from(split.querySelectorAll('.hero-half-left .hero-slide'));
  const rightEls = Array.from(split.querySelectorAll('.hero-half-right .hero-slide'));
  if(!leftEls.length || !rightEls.length) return;

  let idx = 0;
  function activate(el){
    if(!el) return;
    // force a reflow so the Ken Burns zoom animation restarts cleanly every time
    el.classList.remove('active');
    void el.offsetWidth;
    el.classList.add('active');
  }
  function advanceBoth(){
    leftEls[idx % leftEls.length].classList.remove('active');
    rightEls[idx % rightEls.length].classList.remove('active');
    idx = (idx + 1) % Math.max(leftEls.length, rightEls.length);
    activate(leftEls[idx % leftEls.length]);
    activate(rightEls[idx % rightEls.length]);
  }

  heroTimerIds.push(setTimeout(()=>{
    stage.classList.add('hero-fade-out');
    split.classList.add('hero-split-active');
    activate(leftEls[0]);
    activate(rightEls[0]);
  }, 2300));

  // both halves advance TOGETHER on the same interval — never independent
  heroTimerIds.push(setInterval(advanceBoth, 4700));
}

/* ---------- per-category page theme (red/pink/gold variations that persist
   from "Shop by Category" through the category page and into Quick View) ---------- */
function currentThemeCategoryId(){
  if(quickViewProduct && quickViewProduct.cat) return quickViewProduct.cat;
  if(route && route.name==='category' && route.param) return route.param;
  return null;
}
function applyCategoryTheme(){
  const id = currentThemeCategoryId();
  const body = document.body;
  Array.from(body.classList).forEach(c=>{ if(c.indexOf('theme-')===0) body.classList.remove(c); });
  if(id) body.classList.add('theme-'+id);
}

function syncHeaderSpacer(){

function setupReveal(){
  const els = document.querySelectorAll('.reveal');
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); obs.unobserve(e.target);} });
  }, {threshold:0.12});
  els.forEach(el=>obs.observe(el));
  setupCounters();
}

function setupCounters(){
  const nums = document.querySelectorAll('.num[data-count]');
  if(!nums.length) return;
  const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cObs = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(!entry.isIntersecting) return;
      const el = entry.target;
      const target = parseInt(el.getAttribute('data-count'),10) || 0;
      const suffix = el.getAttribute('data-suffix') || '';
      if(prefersReduced){ el.textContent = target + suffix; cObs.unobserve(el); return; }
      const duration = 1300;
      const start = performance.now();
      function tick(now){
        const progress = Math.min((now-start)/duration, 1);
        const eased = 1 - Math.pow(1-progress, 3);
        el.textContent = Math.round(eased*target) + suffix;
        if(progress < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
      cObs.unobserve(el);
    });
  }, {threshold:0.4});
  nums.forEach(el=>cObs.observe(el));
}

/* ---------- premium image magnifier (opt-in via toggle icon, single shared lens) ---------- */
let magLens = null;
let magTouchImg = null;

function getMagLens(){
  if(!magLens){
    magLens = document.createElement('div');
    magLens.className = 'img-magnifier';
    document.body.appendChild(magLens);
  }
  return magLens;
}
function magnifiableImg(target){
  if(!target || !target.classList || !target.classList.contains('real-img')) return null;
  const wrap = target.closest('.pc-clickable, .qv-image');
  return (wrap && wrap.classList.contains('mag-on')) ? target : null;
}
function updateMagLens(img, clientX, clientY){
  const rect = img.getBoundingClientRect();
  if(rect.width < 40 || rect.height < 40) return;
  const ZOOM = 1.7;
  const x = Math.max(0, Math.min(rect.width, clientX - rect.left));
  const y = Math.max(0, Math.min(rect.height, clientY - rect.top));
  const el = getMagLens();
  const lw = el.offsetWidth || 150, lh = el.offsetHeight || 150;
  el.style.left = (clientX - lw/2) + 'px';
  el.style.top = (clientY - lh/2) + 'px';
  el.style.backgroundImage = `url('${img.currentSrc || img.src}')`;
  el.style.backgroundSize = (rect.width*ZOOM) + 'px ' + (rect.height*ZOOM) + 'px';
  el.style.backgroundPosition = (-(x*ZOOM - lw/2)) + 'px ' + (-(y*ZOOM - lh/2)) + 'px';
  el.classList.add('active');
}
function hideMagLens(){ if(magLens) magLens.classList.remove('active'); }

function toggleMagBtn(btn){
  const wrap = btn.closest('.pc-clickable, .qv-image');
  if(!wrap) return;
  const isOn = wrap.classList.toggle('mag-on');
  btn.classList.toggle('active', isOn);
  if(!isOn) hideMagLens();
}

// Desktop / mouse
let magHoveredImg = null;
document.addEventListener('pointermove', function(e){
  if(e.pointerType === 'touch') return;
  const img = magnifiableImg(e.target);
  if(img){ magHoveredImg = img; updateMagLens(img, e.clientX, e.clientY); }
  else if(magHoveredImg){ magHoveredImg = null; hideMagLens(); }
}, {passive:true});
document.addEventListener('mouseleave', function(){ magHoveredImg = null; hideMagLens(); });
window.addEventListener('scroll', hideMagLens, {passive:true});
window.addEventListener('resize', hideMagLens);

// Touch
document.addEventListener('touchstart', function(e){
  const t = e.touches[0];
  const el = document.elementFromPoint(t.clientX, t.clientY);
  const img = magnifiableImg(el);
  if(img){ magTouchImg = img; updateMagLens(img, t.clientX, t.clientY); }
}, {passive:true});
document.addEventListener('touchmove', function(e){
  if(!magTouchImg) return;
  const t = e.touches[0];
  const rect = magTouchImg.getBoundingClientRect();
  const inside = t.clientX>=rect.left && t.clientX<=rect.right && t.clientY>=rect.top && t.clientY<=rect.bottom;
  if(inside){ e.preventDefault(); updateMagLens(magTouchImg, t.clientX, t.clientY); }
  else { hideMagLens(); magTouchImg = null; }
}, {passive:false});
document.addEventListener('touchend', function(){ magTouchImg = null; hideMagLens(); });
document.addEventListener('touchcancel', function(){ magTouchImg = null; hideMagLens(); });

  } else {
    route = {name:'home', param:null};
  }
  window.scrollTo({top:0, behavior:'smooth'});
  renderApp();
});
try{ history.replaceState({name:'home', param:null}, ''); }catch(e){}

  const splash = document.getElementById('splash');
  if(!splash) return;
  const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(prefersReduced){ splash.remove(); return; }
  setTimeout(()=>{
    splash.classList.add('hide');
    setTimeout(()=>{ if(splash.parentNode) splash.remove(); }, 1050);
  }, 1700);
})();
