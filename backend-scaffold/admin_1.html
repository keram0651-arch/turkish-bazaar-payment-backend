<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turkish Bazaar — Admin (Prototype)</title>
<!-- Makes "Add to Home Screen" on iOS launch this as a standalone app
     (hides Safari's address bar) instead of a plain bookmark — required for
     push notifications to work on iOS, see public/push-sw.js. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Turkish Bazaar">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Cairo:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#8B1E2F; --red-deep:#4E0F1B; --red-bright:#A8283A;
  --cream:#FAF6EE; --cream-2:#F1E9DA; --white:#FFFFFF;
  --ink:#2A211C; --ink-soft:#665A4E; --ink-faint:#8C8175;
  --gold:#C9A24B; --gold-light:#E4C97A; --gold-dim:#A9843A;
  --border:#E7DECD;
  --sans:'Jost','Cairo',sans-serif;
  --serif:'Cormorant Garamond',serif;
  --radius:12px; --radius-sm:8px;
  --shadow:0 8px 24px -10px rgba(42,33,28,.14);
  --ok:#5C7A34; --ok-bg:#E7EEDC;
  --warn:#A6641F; --warn-bg:#F6E7CF;
  --info:#46617A; --info-bg:#E5EAF0;
  --teal:#3F7A63; --teal-bg:#E3EEE8;
  --burnt:#A6502B; --burnt-bg:#F3E1D8;
  --danger:#93433F; --danger-bg:#F1E0DF;
  --new:#8A6B2E; --new-bg:#F0E5C9;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--sans);background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
img{max-width:100%;display:block;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:10px;}
::-webkit-scrollbar-track{background:var(--cream-2);}

/* ---------- layout shell ---------- */
.admin-shell{display:flex;min-height:100vh;}

/* ---------- sidebar ---------- */
.sidebar{width:236px;flex-shrink:0;background:var(--red-deep);color:#F3E7D6;
  display:flex;flex-direction:column;position:fixed;top:0;bottom:0;inset-inline-start:0;z-index:60;
  transition:transform .35s cubic-bezier(.16,1,.3,1);}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-brand .mark{width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--red-deep);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--serif);font-weight:700;font-size:1.05rem;}
.sidebar-brand .txt b{display:block;font-family:var(--serif);font-size:1.05rem;color:#fff;line-height:1.15;}
[dir="rtl"] .sidebar-brand .txt b{font-family:var(--sans);font-weight:700;}
.sidebar-brand .txt span{display:block;font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-light);margin-top:2px;}
[dir="rtl"] .sidebar-brand .txt span{letter-spacing:.02em;}
.sidebar-nav{flex:1;padding:14px 10px;overflow-y:auto;}
.sidebar-nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--radius-sm);
  font-size:.86rem;color:#E9DCC8;margin-bottom:3px;transition:background .25s, color .25s;}
.sidebar-nav a svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
.sidebar-nav a:hover{background:rgba(255,255,255,.06);color:#fff;}
.sidebar-nav a.active{background:var(--gold);color:var(--red-deep);font-weight:600;}
.sidebar-nav a.active svg{opacity:1;}
.sidebar-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:.68rem;color:rgba(233,220,200,.6);}
.sidebar-foot b{display:block;color:var(--gold-light);font-size:.72rem;margin-bottom:2px;}

.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(20,10,10,.5);z-index:55;}
.sidebar-overlay.open{display:block;}

/* ---------- main area ---------- */
.main-area{flex:1;margin-inline-start:236px;min-height:100vh;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:40;background:var(--white);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:14px 24px;}
.topbar .mobile-toggle{display:none;width:34px;height:34px;align-items:center;justify-content:center;border-radius:var(--radius-sm);flex-shrink:0;}
.topbar .mobile-toggle svg{width:20px;height:20px;color:var(--ink);}
.topbar h1{font-size:1.05rem;margin:0;font-weight:600;flex:1;min-width:0;}
.topbar .lang-switch{display:flex;align-items:center;gap:4px;font-size:.74rem;color:var(--ink-soft);flex-shrink:0;background:var(--cream-2);
  border-radius:20px;padding:4px;}
.topbar .lang-switch button{padding:5px 11px;border-radius:16px;transition:all .2s;font-weight:500;}
.topbar .lang-switch button.active{background:var(--red);color:#fff;}
.topbar .demo-pill{display:flex;align-items:center;gap:6px;background:var(--new-bg);color:var(--new);
  font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;padding:5px 11px;border-radius:20px;font-weight:600;flex-shrink:0;}
[dir="rtl"] .topbar .demo-pill{letter-spacing:0;text-transform:none;}
.topbar .demo-pill svg{width:12px;height:12px;}
.topbar .admin-avatar{width:34px;height:34px;border-radius:50%;background:var(--cream-2);color:var(--red);
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.8rem;flex-shrink:0;border:1px solid var(--border);}

.content{padding:24px;max-width:1400px;width:100%;margin:0 auto;flex:1;}

@media(max-width:960px){
  .sidebar{transform:translateX(-100%);}
  [dir="rtl"] .sidebar{transform:translateX(100%);}
  .sidebar.open{transform:translateX(0);}
  .main-area{margin-inline-start:0;}
  .topbar .mobile-toggle{display:flex;}
  .content{padding:16px;}
  .topbar .demo-pill{display:none;}
}
@media(max-width:560px){
  .topbar h1{display:none;}
}

/* ---------- shared components ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
.page-head h2{font-size:1.5rem;margin:0 0 4px;font-weight:600;}
.page-head p{margin:0;color:var(--ink-soft);font-size:.86rem;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:var(--radius-sm);
  font-size:.82rem;font-weight:500;transition:all .25s;white-space:nowrap;}
.btn svg{width:15px;height:15px;}
.btn-primary{background:var(--red);color:#fff;}
.btn-primary:hover{background:var(--red-deep);}
.btn-outline{background:var(--white);color:var(--ink);border:1px solid var(--border);}
.btn-outline:hover{border-color:var(--red);color:var(--red);}
.btn-sm{padding:6px 12px;font-size:.74rem;}
.btn-ghost{padding:6px 10px;font-size:.76rem;color:var(--ink-soft);border-radius:var(--radius-sm);display:inline-flex;align-items:center;gap:6px;}
.btn-ghost:hover{background:var(--cream-2);color:var(--ink);}
.btn-ghost svg{width:13px;height:13px;flex-shrink:0;}
.btn-danger-ghost{padding:6px 10px;font-size:.76rem;color:var(--danger);border-radius:var(--radius-sm);display:inline-flex;align-items:center;gap:6px;}
.btn-danger-ghost:hover{background:var(--danger-bg);}
.btn-danger-ghost svg{width:13px;height:13px;flex-shrink:0;}

.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}

/* stat cards */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:22px;}
@media(min-width:700px){.stat-grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:1100px){.stat-grid{grid-template-columns:repeat(5,1fr);}}
.stat-card{padding:18px;display:flex;flex-direction:column;gap:8px;}
.stat-card .stat-top{display:flex;align-items:center;justify-content:space-between;}
.stat-card .stat-icon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stat-card .stat-icon svg{width:16px;height:16px;}
.stat-card .stat-num{font-family:var(--serif);font-size:1.9rem;font-weight:700;color:var(--ink);line-height:1;}
.stat-card .stat-label{font-size:.74rem;color:var(--ink-soft);}
.stat-card .stat-trend{font-size:.68rem;font-weight:600;display:flex;align-items:center;gap:3px;}
.stat-trend.up{color:var(--ok);}
.stat-trend.down{color:var(--danger);}

/* two column dashboard layout */
.dash-grid{display:grid;grid-template-columns:1fr;gap:18px;}
@media(min-width:1050px){.dash-grid{grid-template-columns:1.5fr 1fr;}}

/* chart */
.chart-card{padding:20px;}
.chart-card h3{margin:0 0 4px;font-size:.98rem;}
.chart-card .sub{font-size:.76rem;color:var(--ink-soft);margin-bottom:18px;}
.bars{display:flex;align-items:flex-end;gap:10px;height:160px;padding:0 2px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;}
.bar-col .bar{width:100%;max-width:34px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--gold-light),var(--gold-dim));
  transition:transform .3s ease;position:relative;}
.bar-col:hover .bar{transform:scaleY(1.03);filter:brightness(1.05);}
.bar-col .bar-val{font-size:.6rem;color:var(--ink-soft);position:absolute;top:-16px;left:0;right:0;text-align:center;}
.bar-col .bar-lbl{font-size:.68rem;color:var(--ink-soft);}

/* table */
.table-wrap{overflow-x:auto;}
table.admin-table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:640px;}
table.admin-table th{text-align:start;padding:12px 14px;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);border-bottom:1px solid var(--border);white-space:nowrap;font-weight:600;}
table.admin-table td{padding:13px 14px;border-bottom:1px solid var(--cream-2);vertical-align:middle;}
table.admin-table tr:last-child td{border-bottom:none;}
table.admin-table tbody tr{transition:background .2s;cursor:pointer;}
table.admin-table tbody tr:hover{background:var(--cream-2);}
.cell-strong{font-weight:600;color:var(--ink);}
.cell-muted{color:var(--ink-soft);font-size:.78rem;}

/* status badge */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:.68rem;font-weight:600;letter-spacing:.02em;white-space:nowrap;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge.new{background:var(--new-bg);color:var(--new);}
.badge.confirmed{background:var(--info-bg);color:var(--info);}
.badge.preparing{background:var(--warn-bg);color:var(--warn);}
.badge.ready{background:var(--teal-bg);color:var(--teal);}
.badge.outfordelivery{background:var(--burnt-bg);color:var(--burnt);}
.badge.completed{background:var(--ok-bg);color:var(--ok);}
.badge.cancelled{background:var(--danger-bg);color:var(--danger);}
.badge.instock{background:var(--ok-bg);color:var(--ok);}
.badge.outofstock{background:var(--danger-bg);color:var(--danger);}

/* filters/search bar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px;}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap;}
.filter-chip{padding:7px 14px;border-radius:20px;font-size:.76rem;border:1px solid var(--border);color:var(--ink-soft);transition:all .25s;}
.filter-chip.active,.filter-chip:hover{background:var(--red);border-color:var(--red);color:#fff;}
.search-input{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:8px 14px;background:var(--white);min-width:220px;}
.search-input svg{width:14px;height:14px;color:var(--ink-soft);flex-shrink:0;}
.search-input input{border:none;outline:none;background:none;font-family:inherit;font-size:.82rem;width:100%;color:var(--ink);}

/* back link */
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--ink-soft);margin-bottom:16px;transition:color .25s;}
.back-link:hover{color:var(--red);}
.back-link svg{width:14px;height:14px;}

/* order details */
.od-grid{display:grid;grid-template-columns:1fr;gap:18px;}
@media(min-width:1000px){.od-grid{grid-template-columns:2fr 1fr;}}
.od-section{padding:20px;margin-bottom:18px;}
.od-section h4{margin:0 0 14px;font-size:.9rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);}
.od-cust-row{display:flex;justify-content:space-between;padding:8px 0;font-size:.86rem;border-bottom:1px solid var(--cream-2);}
.od-cust-row:last-child{border-bottom:none;}
.od-cust-row .lbl{color:var(--ink-soft);}
.od-item-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--cream-2);}
.od-item-row:last-child{border-bottom:none;}
.od-item-thumb{width:44px;height:44px;border-radius:8px;background:var(--cream-2);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--gold-dim);}
.od-item-thumb svg{width:18px;height:18px;}
.od-item-info{flex:1;min-width:0;}
.od-item-info .nm{font-size:.86rem;font-weight:500;}
.od-item-info .wt{font-size:.72rem;color:var(--ink-soft);}
.od-item-qty{font-size:.8rem;color:var(--ink-soft);white-space:nowrap;}
.od-item-price{font-size:.86rem;font-weight:600;color:var(--red);white-space:nowrap;min-width:60px;text-align:end;}
.od-totals-row{display:flex;justify-content:space-between;padding:6px 0;font-size:.85rem;}
.od-totals-row.grand{font-size:1.05rem;font-weight:700;border-top:1px solid var(--border);margin-top:8px;padding-top:12px;color:var(--red);}

/* timeline */
.timeline{display:flex;overflow-x:auto;gap:0;padding:6px 2px 14px;}
.tl-step{flex:1;min-width:96px;text-align:center;position:relative;cursor:pointer;}
.tl-step .tl-dot{width:26px;height:26px;border-radius:50%;background:var(--cream-2);border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;margin:0 auto 8px;transition:all .25s;position:relative;z-index:2;}
.tl-step .tl-dot svg{width:12px;height:12px;color:var(--ink-faint);}
.tl-step .tl-line{position:absolute;top:13px;inset-inline-start:-50%;width:100%;height:2px;background:var(--border);z-index:1;}
.tl-step:first-child .tl-line{display:none;}
.tl-step.done .tl-dot{background:var(--ok);border-color:var(--ok);}
.tl-step.done .tl-dot svg{color:#fff;}
.tl-step.done .tl-line{background:var(--ok);}
.tl-step.current .tl-dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px var(--new-bg);}
.tl-step.current .tl-dot svg{color:var(--red-deep);}
.tl-step .tl-label{font-size:.68rem;color:var(--ink-soft);}
.tl-step.done .tl-label,.tl-step.current .tl-label{color:var(--ink);font-weight:600;}
.tl-cancelled-note{background:var(--danger-bg);color:var(--danger);padding:12px 16px;border-radius:var(--radius-sm);font-size:.82rem;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.tl-cancelled-note svg{width:16px;height:16px;flex-shrink:0;}

/* products / categories grid */
.admin-product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
@media(min-width:640px){.admin-product-grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:1000px){.admin-product-grid{grid-template-columns:repeat(4,1fr);}}
.admin-product-card{padding:14px;position:relative;}
.ap-badge{position:absolute;top:12px;inset-inline-start:12px;}
.admin-product-card .thumb{width:100%;aspect-ratio:1/1;border-radius:var(--radius-sm);background:var(--cream-2);
  display:flex;align-items:center;justify-content:center;color:var(--gold-dim);margin-bottom:10px;}
.admin-product-card .thumb svg{width:28px;height:28px;}
.admin-product-card .cat{font-size:.64rem;text-transform:uppercase;letter-spacing:.05em;color:var(--gold-dim);}
.admin-product-card h4{font-size:.86rem;margin:3px 0 4px;}
.admin-product-card .meta{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--ink-soft);margin-bottom:10px;}
.admin-product-card .price{font-family:var(--serif);color:var(--red);font-weight:700;font-size:1rem;}
.admin-product-card .row-actions{display:flex;gap:6px;flex-wrap:wrap;}

.cat-list{display:flex;flex-direction:column;gap:10px;}
.cat-row{display:flex;align-items:center;gap:14px;padding:14px 16px;}
.cat-row .cat-icon{width:40px;height:40px;border-radius:50%;background:var(--cream-2);display:flex;align-items:center;justify-content:center;color:var(--red);flex-shrink:0;}
.cat-row .cat-icon svg{width:18px;height:18px;}
.cat-row .cat-info{flex:1;min-width:0;}
.cat-row .cat-info h4{margin:0 0 2px;font-size:.9rem;}
.cat-row .cat-info span{font-size:.76rem;color:var(--ink-soft);}
.cat-row .row-actions{display:flex;gap:6px;flex-shrink:0;}

/* toggle switch */
.toggle{position:relative;width:38px;height:22px;border-radius:20px;background:var(--border);flex-shrink:0;transition:background .25s;}
.toggle.on{background:var(--ok);}
.toggle .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .25s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.toggle.on .knob{transform:translateX(16px);}

/* modal (confirm) */
.modal-overlay{position:fixed;inset:0;background:rgba(20,10,10,.5);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s;}
.modal-overlay.open{opacity:1;pointer-events:auto;}
.confirm-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-46%);width:90%;max-width:360px;background:#fff;
  border-radius:var(--radius);z-index:210;opacity:0;pointer-events:none;transition:opacity .3s, transform .3s;padding:24px;text-align:center;}
.confirm-modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%);}
.confirm-modal .ic{width:48px;height:48px;border-radius:50%;background:var(--danger-bg);color:var(--danger);
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.confirm-modal .ic svg{width:22px;height:22px;}
.confirm-modal h4{margin:0 0 8px;font-size:1rem;}
.confirm-modal p{margin:0 0 20px;font-size:.84rem;color:var(--ink-soft);}
.confirm-modal .row{display:flex;gap:10px;}
.confirm-modal .row .btn{flex:1;justify-content:center;}

/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);z-index:300;
  background:var(--ink);color:#fff;padding:12px 22px;border-radius:30px;font-size:.82rem;
  opacity:0;pointer-events:none;transition:all .35s;display:flex;align-items:center;gap:8px;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast svg{width:15px;height:15px;color:var(--gold-light);}

/* customers page extras */
.cust-name-cell{display:flex;align-items:center;gap:10px;}
.cust-avatar{width:32px;height:32px;border-radius:50%;background:var(--cream-2);color:var(--red);display:flex;
  align-items:center;justify-content:center;font-size:.72rem;font-weight:700;flex-shrink:0;}

/* settings */
.settings-grid{display:grid;grid-template-columns:1fr;gap:16px;}
@media(min-width:800px){.settings-grid{grid-template-columns:1fr 1fr;}}
.settings-card{padding:20px;}
.settings-card h4{margin:0 0 14px;font-size:.92rem;}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--cream-2);font-size:.84rem;}
.settings-row:last-child{border-bottom:none;}

.empty-note{text-align:center;padding:50px 20px;color:var(--ink-soft);font-size:.86rem;}
</style>
</head>
<body>

<div class="admin-shell">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-area">
    <div class="topbar" id="topbar"></div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay"></div>
<div class="confirm-modal" id="confirmModal"></div>
<div id="toast"></div>

<script>
/* ============================= ICONS ============================= */
const I = {
  logo:'TB',

/* =============================================================================
   REAL ORDERS — fetched from the backend (see API SECTION below). ORDERS is
   null until the first successful fetch; each entry is mapped by mapOrder()
   into the same shape the render functions below expect (kept close to the
   old demo shape on purpose, to keep those functions mostly unchanged).
   ============================================================================= */
let ORDERS = null; // null = not loaded yet

function paymentLabel(method){
  if(method === 'whatsapp') return {en:'Ordered via WhatsApp', ar:'طلب عبر واتساب'};
  // Cash on Delivery is the only other payment method live today; kept as a
  // function so a future method (e.g. Dinarak) is a one-line addition, not a
  // render-code change.
  return {en:'Cash on Delivery', ar:'الدفع عند الاستلام'};
}
function formatOrderDate(iso){
  try{
    const dt = new Date(iso);
    const pad = n=>String(n).padStart(2,'0');
    return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())} ${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
  }catch(e){ return iso||''; }
}
function mapOrder(o){
  const pay = paymentLabel(o.paymentMethod);
  const items = (o.items||[]).map(it=>({
    en: it.nameEn||it.nameAr||'', ar: it.nameAr||it.nameEn||'',
    weightEn: it.weight||'', weightAr: it.weightAr||it.weight||'',
    qty: it.qty||1, price: it.price||0,
  }));
  const subtotal = items.reduce((s,i)=>s+i.price*i.qty,0);
  const total = typeof o.amount==='number' ? o.amount : subtotal;
  const delivery = Math.max(0, Math.round((total-subtotal)*100)/100);
  const custName = (o.customer && o.customer.name) || '';
  return {
    no: o.orderId,
    custEn: custName, custAr: custName, // real names aren't bilingual — same string both ways
    phone: (o.customer && o.customer.phone) || '',
    addrEn: (o.customer && o.customer.address) || '', addrAr: (o.customer && o.customer.address) || '',
    notes: (o.customer && o.customer.notes) || '',
    date: formatOrderDate(o.createdAt),
    createdAt: o.createdAt,
    paymentEn: pay.en, paymentAr: pay.ar,
    status: o.fulfillmentStatus || 'new',
    items, subtotal, delivery, total,
  };
}

/* Dashboard/Sales figures computed from real orders — no invented numbers. */
function ordersInRange(list, start, end){
  return (list||[]).filter(o=>{ const t=new Date(o.createdAt); return t>=start && t<end; });
}
function pctChange(curr, prev){ if(!prev) return null; return Math.round(((curr-prev)/prev)*100); }
function computeWeekSales(list){
  const dayLabels = [{en:'Sun',ar:'أحد'},{en:'Mon',ar:'إثنين'},{en:'Tue',ar:'ثلاثاء'},{en:'Wed',ar:'أربعاء'},{en:'Thu',ar:'خميس'},{en:'Fri',ar:'جمعة'},{en:'Sat',ar:'سبت'}];
  const now = new Date();
  const days = [];
  for(let i=6;i>=0;i--){ const d=new Date(now); d.setDate(d.getDate()-i); d.setHours(0,0,0,0); days.push(d); }
  return days.map(dayStart=>{
    const dayEnd = new Date(dayStart); dayEnd.setDate(dayEnd.getDate()+1);
    const v = ordersInRange(list, dayStart, dayEnd).filter(o=>o.status!=='cancelled').reduce((s,o)=>s+o.total,0);
    const lbl = dayLabels[dayStart.getDay()];
    return {en:lbl.en, ar:lbl.ar, v: Math.round(v*100)/100};
  });
}
function computeBestSellers(list){
  const counts = {};
  (list||[]).forEach(o=>{
    if(o.status==='cancelled') return;
    o.items.forEach(it=>{
      const key = it.en || it.ar || 'item';
      if(!counts[key]) counts[key] = {en: it.en||key, ar: it.ar||key, units:0};
      counts[key].units += (it.qty||1);
    });
  });
  return Object.values(counts).sort((a,b)=>b.units-a.units).slice(0,5);
}
function deriveCustomers(list){
  const byPhone = {};
  (list||[]).forEach(o=>{
    const key = o.phone || o.custEn;
    if(!key) return;
    if(!byPhone[key]) byPhone[key] = {en:o.custEn, ar:o.custAr, phone:o.phone, orders:0, spent:0, last:o.date, lastRaw:o.createdAt};
    const c = byPhone[key];
    c.orders += 1;
    if(o.status!=='cancelled') c.spent += o.total;
    if(new Date(o.createdAt) > new Date(c.lastRaw)){ c.last = o.date; c.lastRaw = o.createdAt; c.en=o.custEn; c.ar=o.custAr; }
  });
  return Object.values(byPhone).sort((a,b)=> new Date(b.lastRaw)-new Date(a.lastRaw));
}

async function fetchOrders(){

  ordersLoading = true;

    ORDERS = (data.orders||[]).map(mapOrder);
    ordersError = null;
    ordersLoading = false;
    renderApp();

/* =============================================================================
   PUSH NOTIFICATIONS — a real system notification the moment a new order
   arrives, generated by this admin panel itself (not WhatsApp, not email).
   Tapping it opens this panel straight to that order. See
   backend-scaffold/services/pushNotifier.js and public/push-sw.js.

   Requires this page to be opened over HTTPS from the backend itself
   (https://<your-service>.onrender.com/admin.html) — a downloaded local
   copy (file://) cannot receive push notifications, browsers block it.
   ============================================================================= */
let pushStatus = 'unknown'; // unknown | unsupported | insecure | denied | off | on | busy

function pushSupported(){
  return 'serviceWorker' in navigator && 'PushManager' in window;
}
function pushSecureContext(){
  // Push requires HTTPS (or localhost). A file:// copy fails this.
  return window.isSecureContext && location.protocol !== 'file:';
}
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}
async function refreshPushStatus(){
  if(!pushSecureContext()){ pushStatus = 'insecure'; return; }
  if(!pushSupported()){ pushStatus = 'unsupported'; return; }
  if(Notification.permission === 'denied'){ pushStatus = 'denied'; return; }
  try{
    const reg = await navigator.serviceWorker.getRegistration('/push-sw.js');
    const sub = reg ? await reg.pushManager.getSubscription() : null;
    pushStatus = sub ? 'on' : 'off';
  }catch(e){ pushStatus = 'off'; }
}
async function enablePushNotifications(){
  if(!pushSecureContext() || !pushSupported()) return;
  pushStatus = 'busy'; renderApp();
  try{
    const keyRes = await fetch(`${API_BASE}/api/push/public-key`);
    if(!keyRes.ok){ pushStatus='off'; showToast(t().pushSetupNeeded || 'Push not configured on the server yet'); renderApp(); return; }
    const { publicKey } = await keyRes.json();

    const permission = await Notification.requestPermission();
    if(permission !== 'granted'){ pushStatus = permission==='denied' ? 'denied' : 'off'; renderApp(); return; }

    const reg = await navigator.serviceWorker.register('/push-sw.js');
    await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(publicKey),
    });

    await fetch(`${API_BASE}/api/push/subscribe`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'X-Admin-Key': getAdminKey() },
      body: JSON.stringify({ subscription: sub.toJSON() }),
    });
    pushStatus = 'on';
    showToast(t().pushEnabledToast || 'Notifications enabled');
  }catch(e){
    pushStatus = 'off';
    showToast(t().pushFailedToast || 'Could not enable notifications');
  }
  renderApp();
}
async function disablePushNotifications(){
  pushStatus = 'busy'; renderApp();
  try{
    const reg = await navigator.serviceWorker.getRegistration('/push-sw.js');
    const sub = reg ? await reg.pushManager.getSubscription() : null;
    if(sub){
      const endpoint = sub.endpoint;
      await sub.unsubscribe();
      fetch(`${API_BASE}/api/push/unsubscribe`, {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'X-Admin-Key': getAdminKey() },
        body: JSON.stringify({ endpoint }),
      }).catch(()=>{});
    }
    pushStatus = 'off';
  }catch(e){ pushStatus = 'off'; }
  renderApp();
}
function registerPushServiceWorker(){
  if(!pushSecureContext() || !pushSupported()) return;
  navigator.serviceWorker.register('/push-sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('message', (event)=>{
    if(event.data && event.data.type==='navigate-order' && event.data.orderId){
      if(getAdminKey()) go('orderDetail', event.data.orderId);
    }
  });
}
function handlePushDeepLink(){
  // A tapped notification opened/focused this tab with #order-<id> — jump
  // straight there once we're connected and orders are loaded.
  const m = /^#order-(.+)$/.exec(location.hash);
  if(m && getAdminKey()) go('orderDetail', decodeURIComponent(m[1]));
}

async function setOrderStatus(no, status){
  const d = t();
  const o = ORDERS && ORDERS.find(x=>x.no===no);
  if(!o) return;
  const prevStatus = o.status;
  o.status = status; // optimistic
  renderApp();
  try{
    await patchFulfillment(no, status);
    showToast(tpl(d.statusOrderToast, {no, status:statusLabel(status)}));
  }catch(e){
    o.status = prevStatus; // revert — the backend didn't confirm the change
    showToast(d.statusOrderError);
    renderApp();
  }
}
function cancelOrderConfirm(no){
  const d = t();
  openConfirm({
    title:d.cancelOrderTitle,
    text:tpl(d.cancelOrderText, {no}),
    confirmLabel:d.cancelOrder,
    onConfirm:()=>setOrderStatus(no,'cancelled'),
  });
}

function waLink(phone, text){
  let digits = String(phone||'').replace(/[^0-9]/g,'');
  if(digits.startsWith('00962')) digits = digits.slice(2);
  if(digits.startsWith('0')) digits = '962'+digits.slice(1);
  if(!digits.startsWith('962')) digits = '962'+digits;
  return `https://wa.me/${digits}${text?('?text='+encodeURIComponent(text)):''}`;
}

function exportOrdersCsv(){
  const d = t();
  if(!ORDERS || !ORDERS.length){ showToast(d.noOrdersYet); return; }
  const headers = ['Order','Name','Phone','Address','Notes','Date','Payment','Status','Subtotal','Delivery','Total'];
  const rows = ORDERS.map(o=>[o.no,o.custEn,o.phone,o.addrEn,o.notes||'',o.date,o.paymentEn,statusLabel(o.status),o.subtotal.toFixed(2),o.delivery.toFixed(2),o.total.toFixed(2)]);
  const esc = v => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const csv = [headers, ...rows].map(r=>r.map(esc).join(',')).join('\r\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `turkish-bazaar-orders-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  if(pushStatus==='busy') return `<div class="settings-row"><span class="cell-muted">${d.notifBusy}</span></div>`;
  if(pushStatus==='on') return `<div class="settings-row"><span class="badge instock">${d.notifOn}</span><button class="btn-danger-ghost" onclick="disablePushNotifications()">${d.notifDisableBtn}</button></div>`;
  return `<div class="settings-row"><span class="cell-muted">${d.notifOff}</span><button class="btn btn-primary btn-sm" onclick="enablePushNotifications()">${d.notifEnableBtn}</button></div>`;
}
function renderSettings(){
  const d = t();
  const key = getAdminKey();
  const masked = key ? (key.slice(0,4) + '•'.repeat(Math.max(0,key.length-4))) : '';
  document.getElementById('content').innerHTML = `
    <div class="page-head"><div><h2>${d.titleSettings}</h2><p>${d.settingsSub}</p></div></div>
    <div class="settings-grid">
      <div class="card settings-card">
        <h4>${d.storeInfo}</h4>
        <div class="settings-row"><span>${d.storeName}</span><span class="cell-muted">${lang==='ar'?'القرية التركية':'Turkish Bazaar'}</span></div>
        <div class="settings-row"><span>${d.phones}</span><span class="cell-muted">0790101517 / 0790152152</span></div>
        <div class="settings-row"><span>${d.branches}</span><span class="cell-muted">${d.branchesVal}</span></div>
        <div class="settings-row"><span>${d.deliveryCoverage}</span><span class="cell-muted">${d.deliveryCoverageVal}</span></div>
      </div>
      <div class="card settings-card">
        <h4>${d.orderPrefs}</h4>
        <div class="settings-row"><span>${d.freeThreshold}</span><span class="cell-muted">${fmt(40)}</span></div>
        <div class="settings-row"><span>${d.standardFee}</span><span class="cell-muted">${fmt(3)}</span></div>
        <div class="settings-row"><span>${d.whatsappOrdering}</span><span class="badge instock">${d.enabled}</span></div>
        <div class="settings-row"><span>${d.websiteCheckout}</span><span class="badge instock">${d.prototype}</span></div>
      </div>
      <div class="card settings-card">
        <h4>${d.adminKeySettings}</h4>
        <div class="settings-row"><span class="cell-muted">${masked}</span><span class="badge instock">${d.adminKeyConnected}</span></div>
        <div class="settings-row"><span>${d.adminKeyChange}</span><button class="btn-danger-ghost" onclick="disconnectAdmin()">${d.adminKeyDisconnect}</button></div>
      </div>
      <div class="card settings-card">
        <h4>${d.notifSettings}</h4>
        <p style="color:var(--ink-soft);font-size:.8rem;margin:0 0 12px;">${d.notifDesc}</p>
        ${renderNotifRow(d)}
      </div>
      <div class="card settings-card">
        <h4>${d.shopWaSettings}</h4>
        <p style="color:var(--ink-soft);font-size:.8rem;margin:0 0 12px;">${d.shopWaDesc}</p>
        ${shopWa
          ? `<div class="settings-row"><span class="cell-muted">${shopWa}</span><span class="badge instock">${d.shopWaConnected}</span></div>
             <div class="settings-row"><span>${d.shopWaChange}</span><input id="shopWaInput" type="tel" value="${shopWa}" placeholder="${d.shopWaLabel}" style="max-width:220px;"><button class="btn btn-primary btn-sm" onclick="saveShopWhatsapp()">${d.shopWaSaveBtn}</button></div>`
          : `<div class="settings-row" style="flex-wrap:wrap;gap:8px;"><input id="shopWaInput" type="tel" placeholder="${d.shopWaLabel}" style="flex:1;min-width:180px;"><button class="btn btn-primary btn-sm" onclick="saveShopWhatsapp()">${d.shopWaSaveBtn}</button></div>`}
      </div>
      <div class="card settings-card">
        <h4>${d.dangerZone}</h4>
        <div class="settings-row"><span>${d.exportData}</span><button class="btn btn-ghost btn-sm" onclick="exportOrdersCsv()">${d.exportBtn}</button></div>
      </div>
      <div class="card settings-card">
        <h4>${d.adminUsers}</h4>
        <div class="settings-row"><span>Admin</span><span class="cell-muted">${d.owner}</span></div>
        <div class="settings-row"><span>${d.inviteMember}</span><button class="btn btn-ghost btn-sm" onclick="fakeAction('${d.inviteToast}')">${I.plus}${d.invite}</button></div>
      </div>
    </div>
  `;
}

/* ============================= CONNECT SCREEN ============================= */
function renderConnectScreen(isError){
  const d = t();
  document.getElementById('content').innerHTML = `
    <div class="card" style="max-width:440px;margin:40px auto;padding:32px;text-align:center;">
      <div class="stat-icon" style="background:var(--new-bg);color:var(--gold-dim);width:48px;height:48px;margin:0 auto 16px;">${I.settings}</div>
      <h2 style="margin:0 0 8px;font-size:1.2rem;">${d.connectTitle}</h2>
      <p style="color:var(--ink-soft);font-size:.86rem;margin-bottom:18px;">${d.connectText}</p>
      ${isError ? `<p style="color:var(--danger);font-size:.82rem;margin-bottom:14px;">${d.connectWrongKey}</p>` : ''}
      <div class="form-field" style="text-align:start;margin-bottom:14px;">
        <label style="font-size:.76rem;color:var(--ink-soft);display:block;margin-bottom:6px;">${d.connectKeyLabel}</label>
        <input id="adminKeyInput" type="password" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:.86rem;" placeholder="••••••••••••" onkeydown="if(event.key==='Enter')submitAdminKey()">
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="submitAdminKey()">${d.connectBtn}</button>
      <p style="color:var(--ink-faint);font-size:.74rem;margin-top:16px;">${d.connectHelp}</p>
    </div>
  `;
}

/* ============================= ROUTER / RENDER ============================= */
function pageContent(){
  switch(route.name){
    case 'dashboard': return renderDashboard();
    case 'orders': return renderOrders();
    case 'orderDetail': return renderOrderDetail(route.param);
    case 'products': return renderProducts();
    case 'categories': return renderCategories();
    case 'customers': return renderCustomers();
    case 'sales': return renderSales();
    case 'settings': return renderSettings();
    default: return renderDashboard();
  }
}
function renderApp(){
  renderSidebar();
  renderTopbar();
  if(!getAdminKey()){
    renderConnectScreen(false);
  } else if(ordersError==='unauthorized'){
    renderConnectScreen(true);
  } else {
    pageContent();
  }
  if(confirmAction) renderConfirmModal();
}

document.getElementById('sidebarOverlay').addEventListener('click', ()=>{ sidebarOpen=false; renderSidebar(); });
document.getElementById('modalOverlay').addEventListener('click', closeConfirm);

renderApp();
if(getAdminKey()) fetchOrders();
// Auto-refresh so new orders (and status changes from another device) show
// up without a manual reload.
setInterval(()=>{ if(getAdminKey() && ordersError!=='unauthorized') fetchOrders(); }, 20000);

// Push notifications: register the service worker up front (harmless if
// already registered), figure out whether notifications are already on for
// this device/browser, and if a notification was just tapped (deep link
// via #order-<id>), jump straight to that order once connected.
registerPushServiceWorker();
refreshPushStatus().then(renderApp);
window.addEventListener('hashchange', handlePushDeepLink);
if(getAdminKey()) handlePushDeepLink();
</script>
</body>
</html>
